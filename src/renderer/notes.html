<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Notatnik — Cribro Sift</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/prose.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="stylesheet" href="css/note-acts.css" />
    <link rel="stylesheet" href="css/ask.css" />
  </head>
  <body>
    <!-- Tło motywu — pierwszym dzieckiem body, reszta warstwę wyżej. -->
    <canvas id="constellation"></canvas>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-heading" viewBox="0 0 24 24">
          <path d="M5.5 5.5v13M14 5.5v13M5.5 12h8.5" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" />
          <path d="M17.5 18.5v-6.6l2.6 2" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24">
          <path d="M9 6.5h11M9 12h11M9 17.5h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          <circle cx="4.6" cy="6.5" r="1.4" fill="currentColor" />
          <circle cx="4.6" cy="12" r="1.4" fill="currentColor" />
          <circle cx="4.6" cy="17.5" r="1.4" fill="currentColor" />
        </symbol>
        <symbol id="i-todo" viewBox="0 0 24 24">
          <path d="M11 6.5h9M11 12h9M11 17.5h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          <rect x="2.6" y="4.5" width="4.8" height="4.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M3.2 12.4 4.7 14l2.6-2.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="2.6" y="15.4" width="4.8" height="4.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5" />
        </symbol>
        <symbol id="i-quote" viewBox="0 0 24 24">
          <path d="M5 5.5v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M9.5 8h10M9.5 12h10M9.5 16h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".75" />
        </symbol>
        <symbol id="i-bold" viewBox="0 0 24 24">
          <path d="M7.5 5.5h5.6a3.6 3.6 0 0 1 0 7.2H7.5V5.5Zm0 7.2h6.4a3.9 3.9 0 0 1 0 7.8H7.5v-7.8Z"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-italic" viewBox="0 0 24 24">
          <path d="M9.6 5.5h6M8 18.5h6M13.6 5.5 10 18.5" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="i-window" viewBox="0 0 24 24">
          <rect x="3.5" y="5" width="17" height="14" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M3.5 9h17" fill="none" stroke="currentColor" stroke-width="1.6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="i-mic" viewBox="0 0 24 24">
          <rect x="9" y="2.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8.5" y="8.5" width="11" height="11" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.6" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4.5 7h15M9.5 7V5.4a1.4 1.4 0 0 1 1.4-1.4h2.2a1.4 1.4 0 0 1 1.4 1.4V7M6.6 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.8-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-sieve" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M4.6 9.4h14.8M4.6 14.6h14.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </symbol>
        <symbol id="i-share" viewBox="0 0 24 24">
          <path d="M12 15.5V3.8M8.2 7.4 12 3.6l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5.5 12.5v6a1.8 1.8 0 0 0 1.8 1.8h9.4a1.8 1.8 0 0 0 1.8-1.8v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 7.2V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <!-- Karteczka z zagiętym rogiem. Rysunki w tym pliku niosą fill
             i stroke same — arkusz nadaje im wyłącznie rozmiar. Bez tych
             dwóch atrybutów karteczka wychodziła CZARNĄ PLAMĄ: domyślne
             `fill` w SVG to czerń, a nie „nic". -->
        <symbol id="i-sticky" viewBox="0 0 24 24">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M20 14h-4.5a1.5 1.5 0 0 0-1.5 1.5V20"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M9 3.5h6l-.8 5.2 3 2.6v2.2H6.8v-2.2l3-2.6L9 3.5ZM12 13.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
        </symbol>
        <symbol id="i-divider" viewBox="0 0 24 24">
          <path d="M3.5 12h17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          <path d="M6 6.5h12M6 17.5h12" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" opacity=".45" />
        </symbol>
        <symbol id="i-align" viewBox="0 0 24 24">
          <path d="M4 6.5h16M4 12h16M4 17.5h16" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
          <path d="M4 9.25h16M4 14.75h16" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" opacity=".45" />
        </symbol>
        <symbol id="i-tag" viewBox="0 0 24 24">
          <path d="M11.2 3.5H20a.5.5 0 0 1 .5.5v8.8a1.5 1.5 0 0 1-.44 1.06l-6.7 6.7a1.5 1.5 0 0 1-2.12 0l-7.3-7.3a1.5 1.5 0 0 1 0-2.12l6.7-6.7A1.5 1.5 0 0 1 11.2 3.5Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <circle cx="16.4" cy="7.6" r="1.5" fill="currentColor" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2.4h7.5A1.5 1.5 0 0 1 20 9.4v8.1a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-pdf" viewBox="0 0 24 24">
          <path d="M6.5 3.5h7l5 5v12a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5 20.5v-15.5A1.5 1.5 0 0 1 6.5 3.5Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M13.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="app">
      <aside id="list">
        <header class="list__head">
          <div>
            <div class="label">Notatnik</div>
            <div class="list__count" id="count">—</div>
          </div>
          <button class="icon-btn icon-btn--accent" id="newNote" title="Nowa notatka">
            <svg><use href="#i-plus" /></svg>
          </button>
        </header>
        <div class="list__search">
          <svg><use href="#i-search" /></svg>
          <input type="search" id="search" placeholder="Szukaj w notatkach…" />
        </div>
        <div class="notes__folders" id="folders"></div>
        <div class="list__items" id="items"></div>
      </aside>

      <!-- Uchwyt na krawędzi listy. Zwinięta lista zostawia całe okno
           notatce — a przy jednym oknie na jedno spotkanie to jest to,
           po co się je otwiera. -->
      <button class="list__edge" id="listToggle" title="Zwiń listę notatek"
              aria-label="Zwiń listę notatek">
        <svg><use href="#i-chevron" /></svg>
      </button>

      <main id="editor">
        <!-- ══ PASEK NOTATKI ══

             Jedenaście przycisków w jednym nieprzerwanym rzędzie to była
             ściana, przez którą trzeba się było przebić wzrokiem: „B"
             sąsiadowało z koszem, a jedno kółko („Aв") chowało w sobie
             nagłówki, listy, cytat i wyrównanie naraz — czyli wszystko,
             po co sięga się przy pisaniu.

             Teraz pasek czyta się w trzech grupach, rozdzielonych kreską,
             i to jest cała zmiana:

               PISZĘ      pogrubienie, kursywa, nagłówki, listy, cytat,
                          wyrównanie, godzina — rzeczy działające na tekst
                          pod kursorem.
               NOTATKA    przesianie, osobne okienko, wierzch, przypięcie,
                          udostępnienie — rzeczy działające na całość.
               KASOWANIE  osobno, za własną kreską i na końcu, bo jako
                          jedyne jest nieodwracalne.

             Listy, cytat i wyrównanie wyszły z menu na wierzch: to są
             czynności robione w trakcie pisania i sięganie po nie przez
             rozwijane menu kosztowało dwa kliknięcia zamiast jednego.
             W menu zostało to, co rzadsze i co potrzebuje nazwy —
             nagłówki, składanie i linia rozdzielająca.

             Pasek jest ten sam co w zakładce Notatki w oknie głównym
             (patrz notes__bar w js/notes-view.js) i to nie przypadek:
             ta sama notatka wygląda w obu miejscach tak samo. -->
        <header class="editor__bar">
          <div class="editor__meta" id="meta"></div>
          <div class="editor__tools">
            <button class="tool" id="dictate" title="Dyktuj prosto do tej notatki">
              <svg><use href="#i-mic" /></svg><span>Dyktuj</span>
            </button>

            <span class="editor__sep"></span>

            <button class="icon-btn" data-format="bold" title="Pogrubienie (⌘B)"
                    aria-label="Pogrubienie"><svg><use href="#i-bold" /></svg></button>
            <button class="icon-btn" data-format="italic" title="Kursywa (⌘I)"
                    aria-label="Kursywa"><svg><use href="#i-italic" /></svg></button>
            <div class="menu-wrap">
              <button class="icon-btn" id="format" title="Nagłówki i bloki"
                      aria-label="Nagłówki i bloki" aria-expanded="false">
                <svg><use href="#i-heading" /></svg>
              </button>
              <div class="menu" id="formatMenu" hidden>
                <button data-format="h1"><span>Nagłówek 1</span><kbd>⌘⇧1</kbd></button>
                <button data-format="h2"><span>Nagłówek 2</span><kbd>⌘⇧2</kbd></button>
                <button data-format="h3"><span>Nagłówek 3</span><kbd>⌘⇧3</kbd></button>
                <div class="menu__sep"></div>
                <button data-format="toggle"><span>Nagłówek składany</span><kbd>⌘⇧E</kbd></button>
                <button data-format="divider"><span>Linia rozdzielająca</span><kbd>⌘⇧-</kbd></button>
              </div>
            </div>
            <button class="icon-btn" data-format="bullet" title="Lista (⌘⇧8)"
                    aria-label="Lista"><svg><use href="#i-list" /></svg></button>
            <button class="icon-btn" data-format="todo" title="Lista zadań (⌘⇧9)"
                    aria-label="Lista zadań"><svg><use href="#i-todo" /></svg></button>
            <button class="icon-btn" data-format="quote" title="Cytat (⌘⇧')"
                    aria-label="Cytat"><svg><use href="#i-quote" /></svg></button>
            <div class="menu-wrap">
              <button class="icon-btn" id="align" title="Wyrównanie tekstu"
                      aria-label="Wyrównanie tekstu" aria-expanded="false">
                <svg><use href="#i-align" /></svg>
              </button>
              <div class="menu" id="alignMenu" hidden>
                <button data-align="left"><span>Do lewej</span></button>
                <button data-align="center"><span>Wyśrodkowany</span></button>
                <button data-align="right"><span>Do prawej</span></button>
                <button data-align="justify"><span>Wyjustowany</span><kbd>⌘⇧J</kbd></button>
              </div>
            </div>
            <!-- Znaki, których nie ma na klawiaturze. Stoją między
                 narzędziami pisania, bo wstawienie znaku JEST pisaniem. -->
            <div class="menu-wrap">
              <button class="icon-btn" id="chars" title="Znaki specjalne"
                      aria-label="Znaki specjalne" aria-expanded="false">
                <svg><use href="#i-omega" /></svg>
              </button>
              <div class="menu menu--chars" id="charsMenu" hidden></div>
            </div>
            <button class="icon-btn" id="stamp" title="Wstaw godzinę (⌘T)"
                    aria-label="Wstaw godzinę"><svg><use href="#i-clock" /></svg></button>

            <span class="editor__sep"></span>

            <button class="icon-btn" id="detach" title="Otwórz w osobnym okienku"
                    aria-label="Otwórz w osobnym okienku"><svg><use href="#i-window" /></svg></button>
          </div>
        </header>

        <!-- Szuflada i etykiety — to samo, co w zakładce Notatki w oknie
             głównym. Notatka jest jedna, więc jej metryczka nie ma prawa
             być widoczna tylko w jednym z okien, które ją pokazują. -->
        <div class="notes__meta" id="noteMeta"></div>

        <div
          id="text"
          class="prose"
          spellcheck="true"
          data-i18n="skip"
          data-empty="true"
          data-placeholder="Pisz albo naciśnij &#8222;Dyktuj&#8221; i mów.&#10;Notatka zapisuje się sama."
        ></div>

        <!-- Czynności na notatce: przypnij, na pulpit, przesiej, udostępnij,
             usuń. Na dole i z podpisami — ten sam pasek co w zakładce
             Notatki i na kartce (patrz actionBar w js/notes-core.js). -->
        <footer class="editor__foot">
          <span id="status">Zapisane</span>
          <span class="dot">·</span>
          <span id="words">0 słów</span>
          <span class="hint" id="hint"></span>
          <span class="spacer"></span>
          <div id="acts"></div>
        </footer>
      </main>
    </div>

    <div id="empty" hidden>
      <div class="empty__inner">
        <div class="label">Notatnik jest pusty</div>
        <h2>Szybka notatka ze spotkania</h2>
        <p>Zacznij pisać albo po prostu mów — tekst wpada tutaj przesiany.</p>
        <button class="btn btn--primary" id="firstNote">Nowa notatka</button>
      </div>
    </div>

    <script src="../shared/strings.js"></script>
    <script src="../shared/richtext.js"></script>
    <script src="../shared/blockmove.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/constellation.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/ask.js"></script>
    <script src="js/notes-core.js"></script>
    <script src="js/notes.js"></script>
  </body>
</html>
