<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Cribro Sift — widget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/prose.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Widget — notatki na wierzchu.

         Okno jest większe niż to, co widać. Znaczek zajmuje sześćdziesiąt
         pikseli u dołu, reszta powierzchni czeka na rozwiniętą listę i na
         kartkę. Dopóki nic nie jest rozwinięte, ta reszta jest przezroczysta
         i przepuszcza kliknięcia na wylot — pilnuje tego js/widget.js.

         Cztery stany, jeden element na każdy:

           data-view="badge"   sam znaczek
           data-view="tray"    znaczek + taca czynności robionych w biegu
           data-view="list"    znaczek + lista notatek „na wierzchu"
           data-view="sticky"  znaczek + kartka jednej notatki

         TACA jest tym, co zostało po listwie nad Dockiem. Rozkłada ją samo
         najechanie kursorem: cztery kółka schodzą kolumną w dół (przy dolnej
         krawędzi ekranu — w górę), a ikonka notatek wychodzi w bok, w tę
         stronę, w którą jest miejsce. Kolumna w pionie, bo znaczek stoi
         zwykle przy krawędzi i w poziomie miejsca nie ma.

         To jest widok KOMPAKTOWY — jeden z dwóch. W drugim („pulpit",
         ustawienie widget.mode) kliknięcie w znaczek nie rozwija tutaj
         niczego: wykłada notatki na pulpit osobnymi okienkami (patrz
         renderer/sticky.html). Znaczek zostaje wtedy sam i robi jedną
         rzecz — chowa i pokazuje całą talię. Umowa jest w obu widokach ta
         sama: KLIKNIĘCIE W ZNACZEK CHOWA WSZYSTKO.

         Kierunek rozwijania (--dir) liczy renderer z położenia okna na
         ekranie: przy górnej krawędzi lista schodzi w dół, przy dolnej
         wychodzi w górę. Widget stawia się w dowolnym miejscu, więc
         jedna stała kolejność zawsze byłaby zła w połowie przypadków.
         ───────────────────────────────────────────────────────── */

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--font-body);
        color: var(--text);
      }

      :root {
        --badge: 60px;
        --gap: 14px;
        --panel-h: 320px;
        --t-fold: 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        /* Podniesienie pod kursorem: krótkie, z lekkim przeskoczeniem celu.
           Tak rusza się rzecz, którą podnosi palec. */
        --t-lift: 0.24s cubic-bezier(0.34, 1.42, 0.5, 1);
        /* Odstęp między kolejnymi kółkami tacy — rozkładają się po kolei,
           nie wszystkie naraz. */
        --fold-step: 38ms;
        /* Odstęp między kolejnymi notatkami na rozwijającej się liście.
           Ten sam, co między kartkami na pulpicie (STICKY_STEP
           w main/main.js) — to jest jeden ruch pokazany w dwóch widokach
           i ma mieć jedno tempo. */
        --step: 34ms;
      }

      #stage {
        position: absolute;
        inset: 0;
      }

      /* ── Znaczek ──────────────────────────────────────────────
         Zawsze widoczny i zawsze w tym samym miejscu, także gdy lista
         jest rozwinięta: to on jest kotwicą całej animacji i to za niego
         przeciąga się widget. */

      /* Kotwica (--ax, --ay) to środek znaczka WEWNĄTRZ okna. Liczy ją
         proces główny przy każdej zmianie rozmiaru okna — bo tylko on wie,
         gdzie kończy się ekran. Tutaj znaczek po prostu na niej siada. */
      #badge {
        position: absolute;
        left: var(--ax, 38px);
        top: var(--ay, 38px);
        width: var(--badge);
        height: var(--badge);
        border: 1px solid var(--accent-30);
        border-radius: 50%;
        background-color: var(--glass);
        background-image:
          radial-gradient(120% 120% at 50% 0%, var(--accent-15), transparent 70%),
          var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-lg), var(--glass-sheen);
        color: var(--accent);
        display: grid;
        place-items: center;
        cursor: grab;
        transform: translate(-50%, -50%) scale(1);
        transition:
          transform var(--t-lift),
          border-color var(--t),
          box-shadow var(--t);
        padding: 0;
      }
      /* Podniesienie pod kursorem rysuje ATRYBUT, nie :hover. Kursor
         chodzi tu nad oknem, które raz po raz przestaje łapać mysz
         (przepuszczanie kliknięć), więc przeglądarkowy stan najechania
         gaśnie i wraca w środku ruchu — a razem z nim od nowa startuje
         przejście z odbiciem. Widać to jako szarpnięcie znaczka przy
         samym zbliżeniu ręki. Kto ustawia atrybut, patrz setNear
         w js/widget.js. */
      #stage[data-near="true"] #badge {
        transform: translate(-50%, -50%) scale(1.08);
        border-color: var(--accent-55);
      }
      /* Spod #stage, nie wprost z #badge: reguła podniesienia (wyżej) też
         siedzi pod #stage i przy słabszym zapisie przeciągany znaczek
         zostawałby powiększony jak pod kursorem — bo pod kursorem wtedy
         jest. Przeciąganie ma być bez odbicia i bez przejścia: znaczek
         trzyma się ręki. */
      #stage[data-drag="true"] #badge {
        cursor: grabbing;
        transform: translate(-50%, -50%) scale(1.04);
        transition: none;
      }
      /* ══ NAGRYWANIE ══
         Pigułka HUD-a znika po trzech sekundach i od tej chwili znaczek jest
         JEDYNYM, co mówi „mikrofon nadal słucha". Musi więc nieść dwie rzeczy
         naraz: że nagranie trwa (oddech) i że coś słychać (skala z poziomu
         głosu — --level podstawia js/widget.js).

         Fiolet zamiast mięty, bo zieleń w tej aplikacji znaczy „gotowe",
         a nagrywanie jest jej przeciwieństwem. */
      #badge[data-state="listening"] {
        color: var(--rec);
        border-color: var(--rec-45);
        background-image:
          radial-gradient(120% 120% at 50% 0%, var(--rec-20), transparent 70%),
          var(--glass-fill);
        transform: translate(-50%, -50%) scale(calc(1 + var(--level, 0) * 0.22));
        animation: badge-pulse 1.25s var(--ease) infinite;
      }
      #stage[data-near="true"] #badge[data-state="listening"] {
        transform: translate(-50%, -50%) scale(calc(1.08 + var(--level, 0) * 0.2));
      }
      /* Dwa pierścienie zamiast jednego i szeroko: ma być widać z drugiego
         końca ekranu, a nie tylko wtedy, gdy się w znaczek patrzy. */
      @keyframes badge-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--rec-55), 0 0 0 0 var(--rec-30);
        }
        50% {
          box-shadow: 0 0 0 11px var(--rec-20), 0 0 0 20px var(--rec-04);
        }
      }

      /* Fala wokół znaczka — rysowana poza jego obrysem, więc nie rusza
         niczyim układem. Widać ją wyłącznie przy nagrywaniu. */
      #badge .wave {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--rec-55);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t);
      }
      /* Fala rośnie do 1,5 i ani trochę dalej: przy tej skali jej krawędź
         dochodzi dokładnie do brzegu okna w stanie zwiniętym (aureola ma
         22 piksele). Szerzej — i głos ucinałby jej wierzchołki o krawędź
         okna zamiast rozchodzić się kołem. */
      #badge[data-state="listening"] .wave {
        opacity: calc(0.35 + var(--level, 0) * 0.55);
        transform: scale(calc(1.1 + var(--level, 0) * 0.35));
        transition: transform 90ms linear, opacity 90ms linear;
      }

      /* Znak na znaczku: sito, gdy nic się nie dzieje, mikrofon w czasie
         nagrywania. Dwa rysunki jeden na drugim, przełączane kryciem —
         podmiana atrybutu `use` gubiłaby przejście. */
      #badge .mark {
        grid-area: 1 / 1;
        transition: opacity var(--t), transform var(--t);
      }
      #badge .mark--mic {
        opacity: 0;
        transform: scale(0.6);
      }
      #badge[data-state="listening"] .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #badge[data-state="listening"] .mark--mic {
        opacity: 1;
        transform: scale(1);
      }
      #badge[data-state="sifting"] {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 34%, transparent);
      }

      /* ══ SPOTKANIE ══

         Dwa stany, oba postawione na #stage, a nie na znaczku: pytanie
         stoi OBOK znaczka i musi widzieć ten sam atrybut.

           data-meet="ask"   na ekranie stoi rozmowa — znaczek pyta
           data-meet="live"  nagranie spotkania trwa

         DYKTOWANIE MA PIERWSZEŃSTWO i stąd `:not([data-state="listening"])`
         przy każdej regule niżej. Te dwie rzeczy chodzą równolegle — osobne
         mikrofony, patrz main/meeting.js — więc znaczek bywa w obu stanach
         naraz. Wygrywa krótszy: dyktowanie trwa kilkanaście sekund i właśnie
         się je wywołało, a spotkanie i tak trwa dalej pod spodem. */
      #badge .mark--meet,
      #badge .mark--air {
        opacity: 0;
        transform: scale(0.6);
      }

      #stage[data-meet="ask"] #badge:not([data-state="listening"]) {
        border-color: var(--accent-55);
        animation: badge-knock 2.4s var(--ease) infinite;
      }
      #stage[data-meet="ask"] #badge:not([data-state="listening"]) .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #stage[data-meet="ask"] #badge:not([data-state="listening"]) .mark--meet {
        opacity: 1;
        transform: scale(1);
      }
      /* Puknięcie, nie oddech. Pytanie ma się przypomnieć raz na jakiś czas
         i przestać; pulsowanie bez końca jest zarezerwowane dla stanu,
         w którym coś naprawdę leci — tam nie wolno go przegapić. */
      @keyframes badge-knock {
        0%, 74%, 100% { box-shadow: var(--shadow-lg), var(--glass-sheen); }
        82% { box-shadow: 0 0 0 10px var(--accent-12), var(--glass-sheen); }
        90% { box-shadow: 0 0 0 3px var(--accent-08), var(--glass-sheen); }
      }

      /* Znak ze studia. Czerwień, nie fiolet — dlaczego, patrz --air
         w css/tokens.css. */
      #stage[data-meet="live"] #badge:not([data-state="listening"]) {
        color: var(--air-ink);
        border-color: var(--air);
        background-color: var(--air);
        background-image: radial-gradient(
          120% 120% at 50% 0%,
          rgba(255, 255, 255, 0.24),
          transparent 70%
        );
        animation: air-pulse 2.2s var(--ease) infinite;
      }
      #stage[data-meet="live"] #badge:not([data-state="listening"]) .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #stage[data-meet="live"] #badge:not([data-state="listening"]) .mark--air {
        opacity: 1;
        transform: scale(1);
      }
      #badge .mark--air {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font: 500 12px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-indent: 0.1em; /* odstęp międzyliterowy dokleja się z prawej */
      }
      #badge .mark--air i { font-style: normal; }
      /* Licznik notatek na wierzchu gaśnie na czas nagrywania: mówi o zupełnie
         innej rzeczy, a miętowy żeton na czerwonym znaku wygląda jak druga
         wiadomość — w chwili, w której liczy się tylko jedna. */
      #stage[data-meet="live"] #badge:not([data-state="listening"]) #count {
        transform: scale(0);
      }
      @keyframes air-pulse {
        0%, 100% { box-shadow: var(--shadow-lg), 0 0 0 0 var(--air-55); }
        50% { box-shadow: var(--shadow-lg), 0 0 0 13px var(--air-04); }
      }

      /* ── Pytanie o notatki ze spotkania ───────────────────────
         Wychodzi z boku znaczka, w tę samą stronę co ikonka notatek —
         czyli tam, gdzie jest miejsce (--tray-side liczy proces główny).
         Okno ma na nie zapas: patrz roomAsk w main/main.js, ta sama
         liczba co --ask-w niżej. */
      #ask {
        --ask-w: 200px;
        position: absolute;
        width: var(--ask-w);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--accent-30);
        background-color: var(--glass);
        background-image: var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-lg), var(--glass-sheen);
        animation: ask-in 0.26s var(--ease) both;
      }
      /* Bez tego dymek NIE ZNIKA: `hidden` chowa przez arkusz przeglądarki,
         a reguła wyżej z własnym `display` bije go bezwarunkowo. */
      #ask[hidden] { display: none; }
      #stage[data-tray-side="right"] #ask {
        left: calc(var(--ax, 38px) + var(--badge) / 2 + 12px);
        transform-origin: left center;
      }
      #stage[data-tray-side="left"] #ask {
        right: calc(100% - var(--ax, 38px) + var(--badge) / 2 + 12px);
        transform-origin: right center;
      }
      /* W PIONIE dymek rośnie w tę samą stronę co taca, a nie od środka
         znaczka. Nad znaczkiem okno ma tylko aureolę (patrz placeWidget
         w main/main.js: po stronie, w którą taca nie wychodzi, zostaje
         `half`), więc dymek wyśrodkowany na znaczku ma dokładnie tyle
         miejsca, ile akurat ma — i pierwsza dłuższa nazwa spotkania
         przycina mu górną krawędź. Kierunek tacy jest z definicji tym,
         w którym miejsce JEST. */
      #stage[data-tray-dir="down"] #ask {
        top: calc(var(--ay, 38px) - var(--badge) / 2);
      }
      #stage[data-tray-dir="up"] #ask {
        bottom: calc(100% - var(--ay, 38px) - var(--badge) / 2);
      }
      @keyframes ask-in {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      .ask__what {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .ask__what b {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text);
      }
      .ask__what span {
        font-size: 11.5px;
        line-height: 1.35;
        color: var(--text-mute);
      }
      .ask__row {
        display: flex;
        gap: 6px;
      }
      #ask button {
        flex: 1;
        padding: 7px 8px;
        border-radius: 9px;
        border: 1px solid transparent;
        font: 500 11.5px var(--font-body);
        cursor: pointer;
        transition: background var(--t), border-color var(--t), color var(--t);
      }
      /* Odmowa równie łatwa jak zgoda: pytanie dotyczy nagrywania ludzi,
         którzy o nic nie prosili, więc „Nie teraz" nie jest tu drobnym
         drukiem pod przyciskiem. */
      .ask__yes {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ask__yes:hover { background: var(--accent-soft); }
      .ask__no {
        background: transparent;
        border-color: var(--line-strong);
        color: var(--text-2);
      }
      .ask__no:hover {
        border-color: var(--accent-30);
        color: var(--text);
      }

      /* ── Taca ─────────────────────────────────────────────────
         Cztery czynności robione w biegu i przejście do notatek. Podział
         pracy jest ten sam w każdym kółku i pilnujemy go wszędzie:

           .slot        miejsce w tacy. Wyjeżdża spod znaczka i wraca pod
                        niego (przesunięcie, skala, krycie), z opóźnieniem
                        liczonym z --i, żeby kółka szły po kolei.
           .slot__face  to, co widać: kółko z ikoną. Rośnie pod kursorem.

         Rozdzielenie nie jest ozdobne: dopóki oba ruchy siedzą na jednym
         elemencie, powiększenie dziedziczy opóźnienie rozkładania i ikona
         wraca do rozmiaru dopiero po dwóch dziesiątych sekundy od zejścia
         kursora. Stąd bierze się szarpanie. */

      #tray {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Każde kółko siada na kotwicy znaczka i dopiero z niej się odsuwa —
         o --dx w bok, o --dy w pion. Dzięki temu zwinięta taca jest
         dokładnie znaczkiem, a nie czterema kółkami schowanymi „gdzieś". */
      .slot {
        position: absolute;
        left: var(--ax, 52px);
        top: var(--ay, 52px);
        width: var(--tray-item, 34px);
        height: var(--tray-item, 34px);
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.5);
        transition:
          transform var(--t-fold),
          opacity var(--t-fold);
        /* Zwijanie idzie od końca kolumny i szybciej niż rozkładanie:
           zamykanie ma być mniej widowiskowe, bo dzieje się wtedy, gdy
           uwaga jest już gdzie indziej. */
        transition-delay: calc((3 - var(--i, 0)) * var(--fold-step) * 0.5);
        /* Jak daleko od środka znaczka stoi to kółko. */
        --reach: calc(
          var(--badge) / 2 + var(--tray-gap, 12px) + var(--tray-item, 34px) / 2 + var(--i, 0) *
            (var(--tray-item, 34px) + var(--tray-step, 9px))
        );
      }
      #stage[data-tray-dir="down"] .slot {
        --dy: var(--reach);
      }
      #stage[data-tray-dir="up"] .slot {
        --dy: calc(-1 * var(--reach));
      }
      /* Notatki nie są piątym kółkiem kolumny: stoją w bok, bo to nie jest
         czynność robiona przy okazji, tylko otwarcie notatek.

         Zerowanie --dy musi siedzieć TUTAJ, przy regułach z identyfikatorem.
         W samym `.slot--notes` przegrywałoby z regułą kierunku kolumny
         (`#stage[data-tray-dir=…] .slot`), która jest mocniejsza — i ikonka
         notatek lądowała w rzędzie pierwszego kółka zamiast przy znaczku. */
      .slot--notes {
        --side: calc(var(--badge) / 2 + var(--tray-gap, 12px) + var(--tray-item, 34px) / 2);
      }
      #stage[data-tray-side="right"] .slot--notes {
        --dx: var(--side);
        --dy: 0px;
      }
      #stage[data-tray-side="left"] .slot--notes {
        --dx: calc(-1 * var(--side));
        --dy: 0px;
      }

      /* Nowa notatka stoi TUŻ ZA notatkami, na tej samej osi w bok — bo
         to jest ta sama sprawa: jedno otwiera to, co leży na pulpicie,
         drugie dokłada tam nową kartkę. Gdyby wpadła do kolumny pod
         znaczkiem, byłaby szóstą czynnością „przy okazji", a nie parą
         do notatek.

         Odległość liczona, nie wpisana: to samo, co `--side`, plus jeszcze
         jedna przerwa i jedno kółko. Zmiana rozmiaru kółek w jednym
         miejscu przesuwa oba gniazda zgodnie. */
      .slot--new {
        --side-2: calc(
          var(--badge) / 2 + var(--tray-gap, 12px) + var(--tray-item, 34px) / 2 +
            var(--tray-gap, 12px) + var(--tray-item, 34px)
        );
      }
      #stage[data-tray-side="right"] .slot--new {
        --dx: var(--side-2);
        --dy: 0px;
      }
      #stage[data-tray-side="left"] .slot--new {
        --dx: calc(-1 * var(--side-2));
        --dy: 0px;
      }
      #stage[data-view="tray"] .slot {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, 0px)) scale(1);
        transition-delay: calc(var(--i, 0) * var(--fold-step));
      }
      /* W trakcie przeciągania znaczka taca jedzie w całości i nic w niej
         nie faluje pod kursorem. */
      #stage[data-drag="true"] .slot__face {
        transform: none !important;
      }

      .slot__face {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: var(--glass);
        background-image: var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-edge);
        box-shadow: var(--glass-sheen), var(--shadow-md);
        color: var(--text-2);
        will-change: transform;
        transition:
          transform var(--t-lift),
          background var(--t),
          color var(--t),
          border-color var(--t);
      }
      .slot__face svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .slot:hover .slot__face {
        color: var(--text-hi);
        border-color: var(--accent-30);
        transform: scale(1.16);
      }
      .slot:active .slot__face {
        transform: scale(1.05);
        transition-duration: 90ms;
      }

      /* Główna czynność odróżnia się kolorem — tak jak w Docku odróżnia się
         aplikacja aktywna. */
      .slot--primary .slot__face {
        background: var(--accent);
        background-image: none;
        border-color: transparent;
        color: var(--accent-ink);
        box-shadow: var(--glow-btn), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .slot--primary:hover .slot__face {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }
      .slot[data-state="listening"] .slot__face {
        background: var(--rec);
        color: var(--rec-ink);
        border-color: transparent;
      }
      .slot[data-state="sifting"] .slot__face {
        background: color-mix(in srgb, var(--warn) 16%, transparent);
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 30%, transparent);
      }

      /* Gniazdo języka mówi tekstem, nie ikoną: dwuliterowy kod jest
         czytelniejszy od jakiegokolwiek symbolu, a przy dwóch językach
         i tak trzeba pokazać parę. */
      .slot--lang .slot__face {
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.03em;
        color: var(--accent);
      }
      .slot--lang:hover .slot__face {
        color: var(--accent-soft);
      }

      /* Dymek z nazwą — po tej samej stronie, po której wyszły notatki,
         bo tam jest miejsce w oknie. Siedzi na gnieździe, nie na kółku,
         więc powiększenie go nie dotyczy. */
      .tip {
        position: absolute;
        top: 50%;
        padding: 3px 8px;
        border-radius: var(--r-sm);
        background-color: var(--glass);
        background-image: var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-edge);
        box-shadow: var(--glass-sheen);
        color: var(--text);
        font-size: 10px;
        font-family: var(--font-mono);
        letter-spacing: 0.04em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t-fast), transform var(--t-fast);
      }
      #stage[data-tray-side="right"] .tip {
        left: calc(100% + 8px);
        transform: translateY(-50%) translateX(-3px);
      }
      #stage[data-tray-side="left"] .tip {
        right: calc(100% + 8px);
        transform: translateY(-50%) translateX(3px);
      }
      /* Dymek notatek stoi najdalej od znaczka, więc jako jedyny musiałby
         wyjść poza okno — dostaje go po tej samej stronie, ale okno ma na
         niego zapas (patrz traySide w main/main.js). */
      #stage[data-view="tray"] .slot:hover .tip {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }

      #stage[data-view="list"] #badge,
      #stage[data-view="sticky"] #badge,
      /* W widoku „pulpit" nie ma tu czego podświetlać poza znaczkiem —
         a rozłożoną talię trzeba po czymś poznać, bo kartki leżą po drugiej
         stronie ekranu i znaczek jest jedynym, co je zbierze. */
      #stage[data-deck="open"] #badge {
        border-color: var(--accent-55);
        box-shadow: var(--shadow-lg), var(--glow);
      }
      #badge svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Licznik notatek na wierzchu. Sam znaczek nie mówiłby, czy coś tam
         w ogóle jest — a to jest jedyne pytanie, które się do niego ma. */
      #count {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: var(--r-pill);
        background: var(--accent);
        color: var(--accent-ink);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 19px;
        text-align: center;
        box-sizing: border-box;
        transform: scale(0);
        transition: transform 0.26s cubic-bezier(0.34, 1.42, 0.5, 1);
      }
      #count[data-on="true"] {
        transform: scale(1);
      }

      /* ── Panel ────────────────────────────────────────────────
         Wspólna szyba dla listy i dla kartki. Kartka dostaje na niej
         wycinankę (clip-path) rysowaną klatka po klatce — to ona robi
         efekt wciągania w znaczek. */

      /* Położenie panelu liczy proces główny — on jeden wie, gdzie kończy
         się ekran i o ile trzeba było przesunąć okno. Tutaj panel po prostu
         siada tam, gdzie mu powiedziano. */
      #panel {
        position: absolute;
        left: var(--panel-x, 22px);
        top: var(--panel-y, 22px);
        width: var(--panel-w, 320px);
        height: var(--panel-h, 400px);
        pointer-events: none;
      }

      /* Szyba jest NIEPRZEZROCZYSTA i to jest zmiana, którą widać
         najbardziej. Pierwsza wersja była szkłem: rozmyciem i sześćdziesięcioma
         procentami krycia. W oknie aplikacji to wygląda dobrze, bo pod spodem
         leży własne tło aplikacji. Widget leży nad CUDZĄ pracą — nad
         dokumentem, arkuszem, czyjąś prezentacją — i przez notatkę
         przebijało się wszystko, co akurat było pod nią. Notatki na wierzchu
         nie da się wtedy przeczytać kątem oka, czyli jedynym sposobem, w jaki
         się ją czyta; trzeba się w nią wpatrzeć, a to już jest przełączenie
         uwagi, przed którym widget ma chronić. */
      .sheet {
        position: absolute;
        inset: 0;
        border-radius: var(--r-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Lista rozwija się zwyczajnie — krótko i bez efektów. Widowiskowa
         jest kartka; gdyby oba ruchy były widowiskowe, żaden by nie był. */
      #list {
        opacity: 0;
        transition:
          opacity var(--t-fold),
          transform var(--t-fold);
        pointer-events: none;
      }
      /* Punkt, z którego lista wyrasta, to zawsze ten bok, którym dotyka
         znaczka. Stała wartość byłaby dobra w jednym przypadku na cztery. */
      #stage[data-dir="up"] #list {
        transform-origin: 50% 100%;
        transform: scale(0.94) translateY(10px);
      }
      #stage[data-dir="down"] #list {
        transform-origin: 50% 0%;
        transform: scale(0.94) translateY(-10px);
      }
      #stage[data-dir="left"] #list {
        transform-origin: 100% 50%;
        transform: scale(0.94) translateX(10px);
      }
      #stage[data-dir="right"] #list {
        transform-origin: 0% 50%;
        transform: scale(0.94) translateX(-10px);
      }
      /* Po regułach kierunku, nie przed — mają tę samą wagę, więc decyduje
         kolejność. */
      #stage[data-view="list"] #list {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      /* Kartka nie ma własnego przejścia — jej kształt rysuje w każdej
         klatce genie() w js/widget.js. CSS nie zna takiej krzywej. */
      #sticky {
        opacity: 0;
        pointer-events: none;
        will-change: clip-path, transform;
      }
      #stage[data-view="sticky"] #sticky {
        pointer-events: auto;
      }

      /* ── Głowa panelu ── */

      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 14px 11px;
        border-bottom: 1px solid var(--line-soft);
        flex: none;
      }
      .head__title {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: var(--track-label);
        text-transform: uppercase;
        color: var(--text-mute);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #stickyTitle {
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--font-body);
        font-size: 12.5px;
        color: var(--text);
        /* Podwójne kliknięcie przepisuje tytuł — kursor ma to zapowiadać. */
        cursor: text;
      }
      #stickyTitle.is-editing {
        outline: none;
        color: var(--text-hi);
        box-shadow: inset 0 -1px 0 var(--accent-55);
        white-space: nowrap;
        overflow-x: auto;
        user-select: text;
        -webkit-user-select: text;
      }

      .ico {
        width: 28px;
        height: 28px;
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-mute);
        cursor: pointer;
        transition:
          background var(--t),
          color var(--t);
      }
      .ico:hover {
        background: var(--accent-12);
        color: var(--accent);
      }
      .ico .swatch {
        width: 14px;
        height: 14px;
      }

      .ico svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ico[data-state="listening"] {
        color: var(--rec);
        background: var(--rec-12);
      }

      /* ── Lista notatek ── */

      #items {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #items::-webkit-scrollbar {
        width: 8px;
      }
      #items::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }

      /* Notatki rozwijają się jedna po drugiej, nie wszystkie naraz.
         Opóźnienie (--i) rozdaje renderer przy rysowaniu listy; to ten sam
         ruch, którym wychodzą kartki na pulpicie, i celowo ma to samo
         tempo. Lista, która pojawia się w jednej klatce, wygląda jak
         podmieniony obrazek — rozłożona po kolei wygląda jak wyjęta. */
      .item {
        text-align: left;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 9px 10px;
        border-radius: 10px;
        cursor: pointer;
        display: grid;
        gap: 3px;
        transition: background var(--t-fast);
      }
      #stage[data-view="list"] .item {
        animation: item-fold 0.34s cubic-bezier(0.22, 1, 0.36, 1)
          calc(var(--i, 0) * var(--step)) both;
      }
      @keyframes item-fold {
        from {
          opacity: 0;
          transform: translateY(-6px) scaleY(0.72);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .item:hover {
        background: var(--accent-08);
      }
      /* Kropka koloru przed tytułem. Na liście kolor jest jedynym, po czym
         notatkę da się poznać bez czytania — a po to się go nadaje. */
      .item__head {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .item .swatch {
        width: 9px;
        height: 9px;
      }
      .item__title {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item__hint {
        font-size: 10.5px;
        color: var(--text-mute);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-left: 16px;
      }

      /* Pusto jest STANEM DOMYŚLNYM, nie awarią: żadna notatka nie trafia
         na wierzch sama z siebie. Ten ekran widzi się więc jako pierwszy
         i ma powiedzieć, co zrobić, a nie tylko że nic nie ma. */
      /* `display: grid` z identyfikatora bije przeglądarkową regułę
         `[hidden] { display: none }` — bez tej linijki ekran „pusto" stoi
         pod listą także wtedy, gdy lista coś ma. Dopóki na wierzchu nic nie
         leżało, nie było tego widać: lista była pusta i oba stany zgadzały
         się przypadkiem. */
      #empty[hidden] {
        display: none;
      }
      #empty {
        margin: auto;
        padding: 0 28px 18px;
        text-align: center;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      #empty svg {
        width: 34px;
        height: 34px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: var(--text-faint);
      }
      #empty p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-mute);
      }
      #empty b {
        color: var(--text-2);
        font-weight: 500;
        white-space: nowrap;
      }

      /* ── Kartka ──
         Treść leci przez ten sam edytor i ten sam arkusz co Notatnik
         (js/editor.js, css/prose.css). Notatka z listą zadań ma na wierzchu
         wyglądać jak lista zadań — z kwadracikami do odhaczania — a nie jak
         zapis „- [ ]", który akurat leży na dysku. Poprzednia wersja miała
         tu zwykłe pole tekstowe i pokazywała surowy Markdown; to samo
         zdanie wyglądało inaczej w aplikacji i inaczej na wierzchu. */

      #stickyBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 11px 13px 13px;
      }
      #stickyBody::-webkit-scrollbar {
        width: 7px;
      }
      #stickyBody::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 4px;
      }
      /* Wielkość pisma podstawia js/widget.js z ustawień (widget.textSize).
         Zapasowa liczba jest tu po to, żeby kartka była czytelna także
         wtedy, gdy ustawienia jeszcze nie doszły. */
      #stickyText.prose {
        font-size: var(--sticky-fs, 13.5px);
        line-height: 1.7;
        min-height: 100%;
        user-select: text;
        -webkit-user-select: text;
      }
      #stickyText.prose[data-empty="true"]::before {
        font-size: calc(var(--sticky-fs, 13.5px) - 1.5px);
        padding: 0 var(--s-4) 10%;
      }

      /* ── Paleta kolorów ──
         Wysuwa się spod głowy panelu, nie z osobnego okna: wybór koloru to
         jedno kliknięcie i ma trwać tyle co jedno kliknięcie. */
      .palette {
        position: absolute;
        top: 42px;
        right: 8px;
        z-index: 3;
        display: flex;
        gap: 6px;
        padding: 7px 8px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--paper-sink);
        box-shadow: var(--shadow-md);
        animation: palette-in 0.18s var(--ease) both;
      }
      .palette[hidden] {
        display: none;
      }
      @keyframes palette-in {
        from {
          opacity: 0;
          transform: translateY(-5px) scale(0.96);
        }
      }
      .palette button {
        /* Bez `flex: none` przycisk kurczy się razem z rzędem i próbki
           robią się z kółek kreskami — kółko jest w środku, a to on jest
           tu elementem układu. */
        flex: none;
        line-height: 0;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        border-radius: 50%;
        transition: transform var(--t-fast), box-shadow var(--t-fast);
      }
      .palette button:hover {
        transform: scale(1.18);
      }
      .palette button[aria-pressed="true"] .swatch {
        border-color: var(--accent);
        box-shadow: var(--paper-sheen), 0 0 0 2px var(--accent-30);
      }
      /* Próbka rysuje się z tych samych zmiennych co kartka, więc kolor
         nadaje jej atrybut na samym przycisku — nie osobny zestaw reguł. */
      .palette .swatch {
        width: 17px;
        height: 17px;
      }

      /* ── Uchwyt rozmiaru ──
         Szyba rozciąga się za róg — ten, który jest najdalej od znaczka,
         bo tylko w tę stronę ma dokąd rosnąć. Który to róg, zależy od
         kierunku rozwinięcia, więc rozstawia go js/widget.js. */
      #grip {
        position: absolute;
        width: 18px;
        height: 18px;
        z-index: 4;
        padding: 0;
        border: 0;
        background: transparent;
        opacity: 0;
        /* Panel przepuszcza kliknięcia na wylot, dopóki nic w nim nie stoi
           (patrz #panel wyżej) — uchwyt jest jego dzieckiem, więc musi ten
           przepust cofnąć u siebie. Tylko przy rozwiniętej szybie: przy
           samym znaczku nie ma czego rozciągać. */
        pointer-events: none;
        transition: opacity var(--t);
        color: var(--text-mute);
      }
      #stage[data-view="list"] #grip,
      #stage[data-view="sticky"] #grip {
        pointer-events: auto;
      }
      #panel:hover #grip,
      #grip[data-drag="true"] {
        opacity: 0.75;
      }
      #grip:hover {
        opacity: 1 !important;
        color: var(--accent);
      }
      #grip svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      /* Róg decyduje i o kursorze, i o tym, jak obrócić rysunek. */
      #stage[data-grip="tr"] #grip { top: 4px; right: 4px; cursor: nesw-resize; transform: rotate(-90deg); }
      #stage[data-grip="br"] #grip { bottom: 4px; right: 4px; cursor: nwse-resize; }
      #stage[data-grip="bl"] #grip { bottom: 4px; left: 4px; cursor: nesw-resize; transform: rotate(90deg); }
      #stage[data-grip="tl"] #grip { top: 4px; left: 4px; cursor: nwse-resize; transform: rotate(180deg); }

      .foot {
        flex: none;
        padding: 8px 14px 10px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        color: var(--text-mute);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .foot .dot {
        opacity: 0.45;
      }
    </style>
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="w-note" viewBox="0 0 24 24">
          <path d="M6 3h8l5 5v13H6z" />
          <path d="M14 3v5h5" />
          <path d="M9 12h6M9 16h4" />
        </symbol>
        <symbol id="w-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="w-back" viewBox="0 0 24 24">
          <path d="M15 5l-7 7 7 7" />
        </symbol>
        <symbol id="w-mic" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
        </symbol>
        <symbol id="w-close" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </symbol>
        <symbol id="w-grip" viewBox="0 0 24 24">
          <path d="M20 8L8 20M20 14l-6 6M20 20h-.01" />
        </symbol>
        <symbol id="w-sieve" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M5 9.5h14M5 14.5h14M9.5 4v16M14.5 4v16" opacity=".7" />
        </symbol>
        <!-- Gęstość sita to POKRĘTŁO, nie sito: znak sita nosi już znaczek
             i dwa takie same rysunki obok siebie znaczyłyby dwie różne rzeczy.

             Trzy rysunki, bo pokrętło ma trzy położenia i to położenie jest
             tu całą treścią: trzy słupki, tyle zapalonych, na którym
             stopniu stoi sito. Wcześniej ikona była jedna i nie mówiła
             o ustawieniu nic — po to trzeba było otwierać okno aplikacji.

             Słupki, a nie suwak z gałką: przy szesnastu pikselach szyna
             suwaka zlewa się z zaczepami w jedną kreskę i widać „kropkę
             obok kreski", a nie położenie. Trzy słupki różnej wysokości
             czyta się z tej odległości od razu, tak jak zasięg sieci. -->
        <symbol id="w-mesh-1" viewBox="0 0 24 24">
          <path d="M6 18.5v-4" stroke-width="2.6" />
          <path d="M12 18.5v-8M18 18.5v-12" stroke-width="2.6" opacity=".26" />
        </symbol>
        <symbol id="w-mesh-2" viewBox="0 0 24 24">
          <path d="M6 18.5v-4M12 18.5v-8" stroke-width="2.6" />
          <path d="M18 18.5v-12" stroke-width="2.6" opacity=".26" />
        </symbol>
        <symbol id="w-mesh-3" viewBox="0 0 24 24">
          <path d="M6 18.5v-4M12 18.5v-8M18 18.5v-12" stroke-width="2.6" />
        </symbol>
        <!-- Okno aplikacji. Ten sam znak, którym w Notatniku odrywa się
             notatkę do własnego okienka — bo znaczy dokładnie to samo. -->
        <symbol id="w-app" viewBox="0 0 24 24">
          <rect x="3.5" y="5" width="17" height="14" rx="2.6" />
          <path d="M3.5 9h17" />
        </symbol>
        <!-- Spotkanie: dwie fale naprzeciw siebie. Ten sam znak, którym
             zakładka Spotkania podpisana jest w oknie aplikacji (i-meeting)
             — bo znaczy dokładnie to samo. Dyktowanie ma mikrofon, rozmowa
             ma dwie strony. -->
        <symbol id="w-meet" viewBox="0 0 24 24">
          <path d="M4 9v6M7.5 6.5v11M11 10v4" stroke-linecap="round" />
          <path d="M13 10v4M16.5 6.5v11M20 9v6" stroke-linecap="round" opacity=".55" />
        </symbol>
        <symbol id="w-bolt" viewBox="0 0 24 24">
          <path d="M12.5 4.5H5v15h10v-7.5" />
          <path d="M19.5 3.2 15 9.6h3.6L17 14.8l4.6-6.4H18l1.5-5.2Z" fill="currentColor" stroke="none" />
          <path d="M8.5 9h3M8.5 12.5h4M8.5 16h5" opacity=".8" />
        </symbol>
      </defs>
    </svg>

    <div id="stage" data-dir="up" data-view="badge" data-tray-dir="down" data-tray-side="right">
      <div id="panel">
        <section class="sheet paper" id="list">
          <header class="head">
            <span class="head__title">Na wierzchu</span>
            <!-- Plusik zakłada ZWYKŁĄ notatkę i od razu kładzie ją na
                 pulpicie — jedna rzecz widoczna z dwóch stron, a nie
                 osobny rodzaj „notatki z tacy". Patrz obsługa #add
                 w js/widget.js. -->
            <button class="ico" id="add" title="Nowa notatka na pulpicie">
              <svg><use href="#w-plus" /></svg>
            </button>
            <button class="ico" id="closeList" title="Zwiń">
              <svg><use href="#w-close" /></svg>
            </button>
          </header>
          <div id="items" data-i18n="skip"></div>
          <div id="empty" hidden>
            <svg><use href="#w-note" /></svg>
            <p>
              Nic tu nie leży. Zacznij nową plusikiem u góry albo odłóż
              tutaj istniejącą — w notatce jest do tego przycisk <b>Na pulpit</b>.
            </p>
          </div>
        </section>

        <section class="sheet paper" id="sticky">
          <header class="head">
            <button class="ico" id="back" title="Wróć do listy">
              <svg><use href="#w-back" /></svg>
            </button>
            <span class="head__title" id="stickyTitle" data-i18n="skip"
                  title="Podwójne kliknięcie zmienia tytuł"></span>
            <button class="ico" id="paint" title="Kolor notatki" aria-expanded="false">
              <span class="swatch"></span>
            </button>
            <button class="ico" id="dictate" title="Dyktuj do tej notatki">
              <svg><use href="#w-mic" /></svg>
            </button>
          </header>
          <div class="palette" id="palette" hidden data-i18n="skip"></div>
          <div id="stickyBody">
            <div
              id="stickyText"
              class="prose"
              spellcheck="true"
              data-i18n="skip"
              data-empty="true"
              data-placeholder="Pisz albo naciśnij mikrofon."
            ></div>
          </div>
          <footer class="foot">
            <span id="stickyState">Zapisane</span>
            <span class="dot">·</span>
            <span id="stickyWords">0 słów</span>
          </footer>
        </section>
        <button id="grip" title="Zmień rozmiar">
          <svg><use href="#w-grip" /></svg>
        </button>
      </div>

      <!-- Taca. Rozkłada ją najechanie na znaczek (patrz js/widget.js);
           kółka wyjeżdżają spod niego kolumną w dół, a notatki w bok. -->
      <div id="tray">
        <button class="slot slot--primary" data-do="dictate" id="slotDictate" style="--i: 0">
          <span class="slot__face"><svg><use href="#w-mic" /></svg></span>
          <span class="tip">Dyktuj — ⌃⌥</span>
        </button>
        <button class="slot" data-do="quick-note" style="--i: 1">
          <span class="slot__face"><svg><use href="#w-bolt" /></svg></span>
          <span class="tip">Szybka notatka</span>
        </button>
        <!-- Gęstość sita. Kliknięcie krąży po trzech położeniach i NIE
             otwiera okna aplikacji — patrz widget:run w main/main.js. -->
        <button class="slot" data-do="sieve" id="slotMesh" style="--i: 2">
          <span class="slot__face"><svg><use href="#w-mesh-2" id="meshMark" /></svg></span>
          <span class="tip" id="meshTip" data-i18n="skip">Gęstość sita</span>
        </button>
        <!-- Język dyktowania: kliknięcie krąży między dwoma językami,
             jednym i rozpoznawaniem automatycznym. -->
        <button class="slot slot--lang" data-do="language" id="slotLang" style="--i: 3">
          <span class="slot__face" id="langLabel" data-i18n="skip">PL·EN</span>
          <span class="tip">Język dyktowania</span>
        </button>

        <!-- Jedyne gniazdo, które otwiera duże okno — i dlatego stoi na
             samym końcu kolumny, najdalej od znaczka. Poza widgetem ta
             sama droga prowadzi przez znaczek w pasku menu. -->
        <button class="slot" data-do="app" style="--i: 4">
          <span class="slot__face"><svg><use href="#w-app" /></svg></span>
          <span class="tip">Otwórz Cribro Sift</span>
        </button>

        <button class="slot slot--notes" id="slotNotes">
          <span class="slot__face"><svg><use href="#w-note" /></svg></span>
          <span class="tip">Notatki</span>
        </button>

        <!-- Nowa kartka od razu na pulpicie. To ZWYKŁA notatka, nie szybka:
             pokazuje się i tutaj, i w „Notatkach" okna głównego, gdzie da
             się ją spokojnie dopisać. Patrz obsługa #slotNewNote
             w js/widget.js. -->
        <button class="slot slot--new" id="slotNewNote">
          <span class="slot__face"><svg><use href="#w-plus" /></svg></span>
          <span class="tip">Nowa notatka</span>
        </button>
      </div>

      <!-- ══ PYTANIE O NOTATKI ZE SPOTKANIA ══
           Wychodzi z boku znaczka, w tę samą stronę co ikonka notatek,
           gdy proces główny rozpozna na ekranie okno rozmowy (patrz
           main/detect.js). Dwa przyciski, bo to jedyne miejsce w widgecie,
           w którym odmowa musi być równie łatwa jak zgoda: pytanie dotyczy
           nagrywania ludzi, którzy o nic nie prosili. -->
      <div id="ask" hidden>
        <p class="ask__what"><b id="askWhere">Spotkanie</b><span>Zapisać przebieg?</span></p>
        <div class="ask__row">
          <button id="askYes" class="ask__yes">Notuj</button>
          <button id="askNo" class="ask__no">Nie teraz</button>
        </div>
      </div>

      <button id="badge" title="Cribro Sift">
        <span class="wave"></span>
        <svg class="mark mark--sieve"><use href="#w-sieve" /></svg>
        <svg class="mark mark--mic"><use href="#w-mic" /></svg>
        <svg class="mark mark--meet"><use href="#w-meet" /></svg>
        <!-- Znak ze studia radiowego. Litery, nie ikona: „ON AIR" czyta
             każdy i nikt nie musi zgadywać, co znaczy kolejny rysunek. -->
        <span class="mark mark--air" aria-hidden="true"><i>ON</i><i>AIR</i></span>
        <span id="count" data-on="false">0</span>
      </button>
    </div>

    <script src="../shared/strings.js"></script>
    <script src="../shared/richtext.js"></script>
    <script src="../shared/blockmove.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/notes-core.js"></script>
    <script src="js/genie.js"></script>
    <script src="js/widget.js"></script>
  </body>
</html>
