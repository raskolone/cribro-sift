<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Cribro Sift — widget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Widget — znaczek i menu po łuku.

         Okno jest większe niż to, co widać. Znaczek zajmuje sześćdziesiąt
         pikseli, reszta powierzchni czeka na rozłożone menu. Dopóki nic nie
         jest rozłożone, ta reszta jest przezroczysta i przepuszcza
         kliknięcia na wylot — pilnuje tego js/widget.js.

         Dwa stany, jeden element na każdy:

           data-view="badge"   sam znaczek
           data-view="tray"    znaczek + menu po łuku

         Notatki na wierzchu leżą wyłącznie na pulpicie, osobnymi okienkami
         (patrz renderer/sticky.html) — znaczek ich nie rysuje. Podwójne
         kliknięcie w znaczek chowa i pokazuje całą talię naraz; pojedyncze
         tylko go wciska i odklika.

         Kierunek, w który wychodzi łuk (--tray-dir, --tray-side), liczy
         renderer main z położenia okna na ekranie: przy górnej krawędzi
         w dół, przy dolnej w górę, i tak samo w poziomie. Widget stawia się
         w dowolnym miejscu, więc jedna stała strona zawsze byłaby zła
         w połowie przypadków. Same przesunięcia kółek (--dx, --dy) liczy
         main.js trygonometrią i podstawia tu jako gotowe piksele — patrz
         applyArc w js/widget.js. */

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--font-body);
        color: var(--text);
      }

      :root {
        --badge: 60px;
        --t-fold: 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        /* Podniesienie pod kursorem: krótkie, z lekkim przeskoczeniem celu.
           Tak rusza się rzecz, którą podnosi palec. */
        --t-lift: 0.24s cubic-bezier(0.34, 1.42, 0.5, 1);
        /* Odstęp między kolejnymi kółkami menu — rozkładają się po kolei,
           nie wszystkie naraz. */
        --fold-step: 38ms;
      }

      #stage {
        position: absolute;
        inset: 0;
      }

      /* ── Znaczek ──────────────────────────────────────────────
         Zawsze widoczny i zawsze w tym samym miejscu, także gdy menu jest
         rozłożone: to on jest kotwicą całej animacji i to za niego
         przeciąga się widget. */

      /* Kotwica (--ax, --ay) to środek znaczka WEWNĄTRZ okna. Liczy ją
         proces główny przy każdej zmianie rozmiaru okna — bo tylko on wie,
         gdzie kończy się ekran. Tutaj znaczek po prostu na niej siada. */
      #badge {
        position: absolute;
        left: var(--ax, 38px);
        top: var(--ay, 38px);
        width: var(--badge);
        height: var(--badge);
        border: 1px solid var(--accent-30);
        border-radius: 50%;
        background-color: var(--glass);
        background-image:
          radial-gradient(120% 120% at 50% 0%, var(--accent-15), transparent 70%),
          var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-lg), var(--glass-sheen);
        color: var(--accent);
        display: grid;
        place-items: center;
        cursor: grab;
        transform: translate(-50%, -50%) scale(1);
        transition:
          transform var(--t-lift),
          border-color var(--t),
          box-shadow var(--t);
        padding: 0;
      }
      /* Podniesienie pod kursorem rysuje ATRYBUT, nie :hover. Kursor
         chodzi tu nad oknem, które raz po raz przestaje łapać mysz
         (przepuszczanie kliknięć), więc przeglądarkowy stan najechania
         gaśnie i wraca w środku ruchu — a razem z nim od nowa startuje
         przejście z odbiciem. Widać to jako szarpnięcie znaczka przy
         samym zbliżeniu ręki. Kto ustawia atrybut, patrz setNear
         w js/widget.js. */
      #stage[data-near="true"] #badge {
        transform: translate(-50%, -50%) scale(1.08);
        border-color: var(--accent-55);
      }
      /* Spod #stage, nie wprost z #badge: reguła podniesienia (wyżej) też
         siedzi pod #stage i przy słabszym zapisie przeciągany znaczek
         zostawałby powiększony jak pod kursorem — bo pod kursorem wtedy
         jest. Przeciąganie ma być bez odbicia i bez przejścia: znaczek
         trzyma się ręki. */
      #stage[data-drag="true"] #badge {
        cursor: grabbing;
        transform: translate(-50%, -50%) scale(1.04);
        transition: none;
      }
      /* ══ WCIŚNIĘCIE ══
         Haptyczny stan „wciśnięty": znaczek zapada się w głąb ekranu.
         Mikroskala i przesunięcie w dół imitują naciśnięty guzik, a cień
         zewnętrzny ustępuje miejsca cieniowi WEWNĄTRZ obrysu — tej samej
         sztuczce, którą fizyczne przyciski pokazują wgłębienie. Czysto
         wizualne: nie otwiera niczego, patrz setPressed w js/widget.js. */
      #badge[data-pressed="true"] {
        transform: translate(-50%, -50%) scale(0.95) translateY(1px);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.45), var(--glass-sheen);
        transition:
          transform 0.12s var(--ease),
          box-shadow 0.12s var(--ease);
      }
      #stage[data-near="true"] #badge[data-pressed="true"] {
        transform: translate(-50%, -50%) scale(0.95) translateY(1px);
      }
      /* ══ NAGRYWANIE ══
         Pigułka HUD-a znika po trzech sekundach i od tej chwili znaczek jest
         JEDYNYM, co mówi „mikrofon nadal słucha". Musi więc nieść dwie rzeczy
         naraz: że nagranie trwa (oddech) i że coś słychać (skala z poziomu
         głosu — --level podstawia js/widget.js).

         Fiolet zamiast mięty, bo zieleń w tej aplikacji znaczy „gotowe",
         a nagrywanie jest jej przeciwieństwem. */
      #badge[data-state="listening"] {
        color: var(--rec);
        border-color: var(--rec-45);
        background-image:
          radial-gradient(120% 120% at 50% 0%, var(--rec-20), transparent 70%),
          var(--glass-fill);
        transform: translate(-50%, -50%) scale(calc(1 + var(--level, 0) * 0.22));
        animation: badge-pulse 1.25s var(--ease) infinite;
      }
      #stage[data-near="true"] #badge[data-state="listening"] {
        transform: translate(-50%, -50%) scale(calc(1.08 + var(--level, 0) * 0.2));
      }
      /* Dwa pierścienie zamiast jednego i szeroko: ma być widać z drugiego
         końca ekranu, a nie tylko wtedy, gdy się w znaczek patrzy. */
      @keyframes badge-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 var(--rec-55), 0 0 0 0 var(--rec-30);
        }
        50% {
          box-shadow: 0 0 0 11px var(--rec-20), 0 0 0 20px var(--rec-04);
        }
      }

      /* Fala wokół znaczka — rysowana poza jego obrysem, więc nie rusza
         niczyim układem. Widać ją wyłącznie przy nagrywaniu. */
      #badge .wave {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--rec-55);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t);
      }
      /* Fala rośnie do 1,5 i ani trochę dalej: przy tej skali jej krawędź
         dochodzi dokładnie do brzegu okna w stanie zwiniętym (aureola ma
         22 piksele). Szerzej — i głos ucinałby jej wierzchołki o krawędź
         okna zamiast rozchodzić się kołem. */
      #badge[data-state="listening"] .wave {
        opacity: calc(0.35 + var(--level, 0) * 0.55);
        transform: scale(calc(1.1 + var(--level, 0) * 0.35));
        transition: transform 90ms linear, opacity 90ms linear;
      }

      /* Znak na znaczku: sito, gdy nic się nie dzieje, mikrofon w czasie
         nagrywania. Dwa rysunki jeden na drugim, przełączane kryciem —
         podmiana atrybutu `use` gubiłaby przejście. */
      #badge .mark {
        grid-area: 1 / 1;
        transition: opacity var(--t), transform var(--t);
      }
      #badge .mark--mic {
        opacity: 0;
        transform: scale(0.6);
      }
      #badge[data-state="listening"] .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #badge[data-state="listening"] .mark--mic {
        opacity: 1;
        transform: scale(1);
      }
      #badge[data-state="sifting"] {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 34%, transparent);
      }

      /* ══ SPOTKANIE ══

         Dwa stany, oba postawione na #stage, a nie na znaczku: pytanie
         stoi OBOK znaczka i musi widzieć ten sam atrybut.

           data-meet="ask"   na ekranie stoi rozmowa — znaczek pyta
           data-meet="live"  nagranie spotkania trwa

         DYKTOWANIE MA PIERWSZEŃSTWO i stąd `:not([data-state="listening"])`
         przy każdej regule niżej. Te dwie rzeczy chodzą równolegle — osobne
         mikrofony, patrz main/meeting.js — więc znaczek bywa w obu stanach
         naraz. Wygrywa krótszy: dyktowanie trwa kilkanaście sekund i właśnie
         się je wywołało, a spotkanie i tak trwa dalej pod spodem. */
      #badge .mark--meet,
      #badge .mark--air {
        opacity: 0;
        transform: scale(0.6);
      }

      #stage[data-meet="ask"] #badge:not([data-state="listening"]) {
        border-color: var(--accent-55);
        animation: badge-knock 2.4s var(--ease) infinite;
      }
      #stage[data-meet="ask"] #badge:not([data-state="listening"]) .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #stage[data-meet="ask"] #badge:not([data-state="listening"]) .mark--meet {
        opacity: 1;
        transform: scale(1);
      }
      /* Puknięcie, nie oddech. Pytanie ma się przypomnieć raz na jakiś czas
         i przestać; pulsowanie bez końca jest zarezerwowane dla stanu,
         w którym coś naprawdę leci — tam nie wolno go przegapić. */
      @keyframes badge-knock {
        0%, 74%, 100% { box-shadow: var(--shadow-lg), var(--glass-sheen); }
        82% { box-shadow: 0 0 0 10px var(--accent-12), var(--glass-sheen); }
        90% { box-shadow: 0 0 0 3px var(--accent-08), var(--glass-sheen); }
      }

      /* Znak ze studia. Czerwień, nie fiolet — dlaczego, patrz --air
         w css/tokens.css. */
      #stage[data-meet="live"] #badge:not([data-state="listening"]) {
        color: var(--air-ink);
        border-color: var(--air);
        background-color: var(--air);
        background-image: radial-gradient(
          120% 120% at 50% 0%,
          rgba(255, 255, 255, 0.24),
          transparent 70%
        );
        animation: air-pulse 2.2s var(--ease) infinite;
      }
      #stage[data-meet="live"] #badge:not([data-state="listening"]) .mark--sieve {
        opacity: 0;
        transform: scale(0.6);
      }
      #stage[data-meet="live"] #badge:not([data-state="listening"]) .mark--air {
        opacity: 1;
        transform: scale(1);
      }
      #badge .mark--air {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font: 500 12px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-indent: 0.1em; /* odstęp międzyliterowy dokleja się z prawej */
      }
      #badge .mark--air i { font-style: normal; }
      @keyframes air-pulse {
        0%, 100% { box-shadow: var(--shadow-lg), 0 0 0 0 var(--air-55); }
        50% { box-shadow: var(--shadow-lg), 0 0 0 13px var(--air-04); }
      }

      /* ── Pytanie o notatki ze spotkania ───────────────────────
         Wychodzi z boku znaczka, w tę samą stronę co menu — tam, gdzie jest
         miejsce (--tray-side liczy proces główny). Okno ma na nie zapas:
         patrz roomAsk w main/main.js, ta sama liczba co --ask-w niżej. */
      #ask {
        --ask-w: 200px;
        position: absolute;
        width: var(--ask-w);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--accent-30);
        background-color: var(--glass);
        background-image: var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--shadow-lg), var(--glass-sheen);
        animation: ask-in 0.26s var(--ease) both;
      }
      /* Bez tego dymek NIE ZNIKA: `hidden` chowa przez arkusz przeglądarki,
         a reguła wyżej z własnym `display` bije go bezwarunkowo. */
      #ask[hidden] { display: none; }
      #stage[data-tray-side="right"] #ask {
        left: calc(var(--ax, 38px) + var(--badge) / 2 + 12px);
        transform-origin: left center;
      }
      #stage[data-tray-side="left"] #ask {
        right: calc(100% - var(--ax, 38px) + var(--badge) / 2 + 12px);
        transform-origin: right center;
      }
      #stage[data-tray-dir="down"] #ask {
        top: calc(var(--ay, 38px) - var(--badge) / 2);
      }
      #stage[data-tray-dir="up"] #ask {
        bottom: calc(100% - var(--ay, 38px) - var(--badge) / 2);
      }
      @keyframes ask-in {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      .ask__what {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .ask__what b {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text);
      }
      .ask__what span {
        font-size: 11.5px;
        line-height: 1.35;
        color: var(--text-mute);
      }
      .ask__row {
        display: flex;
        gap: 6px;
      }
      #ask button {
        flex: 1;
        padding: 7px 8px;
        border-radius: 9px;
        border: 1px solid transparent;
        font: 500 11.5px var(--font-body);
        cursor: pointer;
        transition: background var(--t), border-color var(--t), color var(--t);
      }
      /* Odmowa równie łatwa jak zgoda: pytanie dotyczy nagrywania ludzi,
         którzy o nic nie prosili, więc „Nie teraz" nie jest tu drobnym
         drukiem pod przyciskiem. */
      .ask__yes {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ask__yes:hover { background: var(--accent-soft); }
      .ask__no {
        background: transparent;
        border-color: var(--line-strong);
        color: var(--text-2);
      }
      .ask__no:hover {
        border-color: var(--accent-30);
        color: var(--text);
      }

      /* ── Menu po łuku ─────────────────────────────────────────
         Sześć kółek na ćwierćobrocie wokół znaczka: cztery przejścia
         i dwa nieaktywne miejsca na przyszłość.

           .slot        miejsce na łuku. Wyjeżdża spod znaczka i wraca pod
                        niego (przesunięcie, skala, krycie), z opóźnieniem
                        liczonym z --i, żeby kółka szły po kolei.
           .slot__face  to, co widać: kółko z ikoną. Rośnie pod kursorem.

         Przesunięcie każdego kółka (--dx, --dy) NIE jest liczone w CSS-ie —
         CSS nie zna trygonometrii. Main.js liczy łuk (patrz arcSlots)
         i podstawia gotowe piksele przez js/widget.js (applyArc). Tutaj
         zostaje tylko animacja wyjścia z tych współrzędnych i powrotu do
         zera. */

      #tray {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Każde kółko siada na kotwicy znaczka i dopiero z niej się odsuwa —
         o --dx w bok, o --dy w pion. Dzięki temu zwinięty widget jest
         dokładnie znaczkiem, a nie sześcioma kółkami schowanymi „gdzieś". */
      .slot {
        position: absolute;
        left: var(--ax, 52px);
        top: var(--ay, 52px);
        width: 34px;
        height: 34px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.5);
        transition:
          transform var(--t-fold),
          opacity var(--t-fold);
        /* Zwijanie idzie od końca łuku i szybciej niż rozkładanie:
           zamykanie ma być mniej widowiskowe, bo dzieje się wtedy, gdy
           uwaga jest już gdzie indziej. */
        transition-delay: calc((5 - var(--i, 0)) * var(--fold-step) * 0.5);
      }
      #stage[data-view="tray"] .slot {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, 0px)) scale(1);
        transition-delay: calc(var(--i, 0) * var(--fold-step));
      }
      /* W trakcie przeciągania znaczka menu jedzie w całości i nic w nim
         nie faluje pod kursorem. */
      #stage[data-drag="true"] .slot__face {
        transform: none !important;
      }

      .slot__face {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: var(--glass);
        background-image: var(--glass-fill);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-edge);
        box-shadow: var(--glass-sheen), var(--shadow-md);
        color: var(--text-2);
        will-change: transform;
        transition:
          transform var(--t-lift),
          background var(--t),
          color var(--t),
          border-color var(--t);
      }
      .slot__face svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .slot:not([disabled]):hover .slot__face {
        color: var(--text-hi);
        border-color: var(--accent-30);
        transform: scale(1.16);
      }
      .slot:not([disabled]):active .slot__face {
        transform: scale(1.05);
        transition-duration: 90ms;
      }

      /* Poranek: bursztynowy akcent na stałe, nie tylko w trakcie zbierania
         materiału — ma się wyróżniać w menu dokładnie tak, jak zielony
         mikrofon na znaczku, bo to druga czynność, po którą sięga się bez
         namysłu. */
      .slot--sun .slot__face {
        background: var(--sun);
        background-image: none;
        border-color: transparent;
        color: var(--sun-ink);
        box-shadow: var(--sun-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .slot--sun:hover .slot__face {
        background: var(--sun-soft);
        color: var(--sun-ink);
      }
      .slot--sun[data-state="loading"] .slot__face {
        color: var(--sun-ink);
        animation: slot-loading 1.1s ease-in-out infinite;
      }
      @keyframes slot-loading {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }

      /* Gniazdo aplikacji odróżnia się kolorem — jedyne w menu, które
         otwiera duże okno, i to ma być widać zanim się w nie kliknie. */
      .slot--primary .slot__face {
        background: var(--accent);
        background-image: none;
        border-color: transparent;
        color: var(--accent-ink);
        box-shadow: var(--glow-btn), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .slot--primary:hover .slot__face {
        background: var(--accent-soft);
        color: var(--accent-ink);
      }

      /* Dwa miejsca na przyszłość: widoczne, ale wyraźnie nieaktywne —
         przygaszone i bez reakcji na kursor. System pokaże „Wkrótce" przy
         dłuższym najechaniu (title), bez własnej bańki. */
      .slot--soon {
        opacity: 0.35;
        pointer-events: none;
        cursor: default;
      }
      #stage[data-view="tray"] .slot--soon {
        opacity: 0.35;
      }

      #stage[data-deck="open"] #badge {
        border-color: var(--accent-55);
        box-shadow: var(--shadow-lg), var(--glow);
      }
      #badge svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="w-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <!-- Notatnik: zeszyt spięty przy grzbiecie. -->
        <symbol id="w-book" viewBox="0 0 24 24">
          <rect x="5" y="3.5" width="14" height="17" rx="2.2" />
          <path d="M9 3.5v17" />
          <path d="M12 8.5h4M12 12h4" opacity=".75" />
        </symbol>
        <symbol id="w-mic" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
        </symbol>
        <symbol id="w-sieve" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M5 9.5h14M5 14.5h14M9.5 4v16M14.5 4v16" opacity=".7" />
        </symbol>
        <!-- Okno aplikacji. Ten sam znak, którym w Notatniku odrywa się
             notatkę do własnego okienka — bo znaczy dokładnie to samo. -->
        <symbol id="w-app" viewBox="0 0 24 24">
          <rect x="3.5" y="5" width="17" height="14" rx="2.6" />
          <path d="M3.5 9h17" />
        </symbol>
        <!-- Spotkanie: dwie fale naprzeciw siebie. Ten sam znak, którym
             zakładka Spotkania podpisana jest w oknie aplikacji (i-meeting)
             — bo znaczy dokładnie to samo. Dyktowanie ma mikrofon, rozmowa
             ma dwie strony. -->
        <symbol id="w-meet" viewBox="0 0 24 24">
          <path d="M4 9v6M7.5 6.5v11M11 10v4" stroke-linecap="round" />
          <path d="M13 10v4M16.5 6.5v11M20 9v6" stroke-linecap="round" opacity=".55" />
        </symbol>
        <!-- Poranek: słońce nad kreską horyzontu. Ten sam znak, którym
             podpisany jest Poranek w pasku menu — bo znaczy dokładnie to
             samo. -->
        <symbol id="w-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 3v2.4M12 18.6V21M4.2 12H6.6M17.4 12h2.4M6.2 6.2l1.7 1.7M16.1 16.1l1.7 1.7M6.2 17.8l1.7-1.7M16.1 7.9l1.7-1.7" />
        </symbol>
        <!-- Szybka notatka / Quick capture -->
        <symbol id="w-quick" viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="stage" data-view="badge" data-tray-dir="down" data-tray-side="right">
      <!-- Menu po łuku. Rozkłada je najechanie na znaczek (patrz
           js/widget.js); kółka wyjeżdżają spod niego na łuk, w tę ćwiartkę,
           w którą jest miejsce. -->
      <div id="tray">
        <!-- Poranek: pierwsze kółko, najbliżej poziomej krawędzi łuku.
             Milczy, gdy Poranek nie ma jeszcze konta — gatherBriefing
             wtedy wypełnia okno materiałem lokalnym. -->
        <button class="slot slot--sun" data-do="briefing" id="slotBriefing" style="--i: 0" title="Poranek">
          <span class="slot__face"><svg><use href="#w-sun" /></svg></span>
        </button>

        <!-- Nowa karteczka od razu na pulpicie. Patrz newDeskNote
             w js/widget.js. -->
        <button class="slot" data-do="new-sticky" id="slotNewNote" style="--i: 1" title="Nowa karteczka">
          <span class="slot__face"><svg><use href="#w-plus" /></svg></span>
        </button>

        <!-- Notatnik: całe archiwum notatek, w osobnym oknie, z szukaniem
             i szufladami. -->
        <button class="slot" data-do="notebook" id="slotBook" style="--i: 2" title="Notatnik">
          <span class="slot__face"><svg><use href="#w-book" /></svg></span>
        </button>

        <!-- Jedyne gniazdo w całym widgecie, które otwiera okno aplikacji —
             i dlatego stoi ostatnie z żywych, najdalej od tego, co jest pod
             ręką na co dzień. Poza widgetem ta sama droga prowadzi przez
             znaczek w pasku menu. -->
        <button class="slot slot--primary" data-do="app" id="slotApp" style="--i: 3" title="Otwórz Cribro Sift">
          <span class="slot__face"><svg><use href="#w-app" /></svg></span>
        </button>

        <!-- Dwa nieaktywne miejsca na przyszłe moduły. -->
        <button class="slot slot--soon" disabled aria-disabled="true" style="--i: 4" title="Wkrótce">
          <span class="slot__face"></span>
        </button>
        <button class="slot slot--soon" disabled aria-disabled="true" style="--i: 5" title="Wkrótce">
          <span class="slot__face"></span>
        </button>
      </div>

      <!-- ══ PYTANIE O NOTATKI ZE SPOTKANIA ══
           Wychodzi z boku znaczka, w tę samą stronę co menu, gdy proces
           główny rozpozna na ekranie okno rozmowy (patrz main/detect.js).
           Dwa przyciski, bo to jedyne miejsce w widgecie, w którym odmowa
           musi być równie łatwa jak zgoda: pytanie dotyczy nagrywania
           ludzi, którzy o nic nie prosili. -->
      <div id="ask" hidden>
        <p class="ask__what"><b id="askWhere">Spotkanie</b><span>Zapisać przebieg?</span></p>
        <div class="ask__row">
          <button id="askYes" class="ask__yes">Notuj</button>
          <button id="askNo" class="ask__no">Nie teraz</button>
        </div>
      </div>

      <button id="badge" title="Cribro Sift">
        <span class="wave"></span>
        <svg class="mark mark--sieve"><use href="#w-sieve" /></svg>
        <svg class="mark mark--mic"><use href="#w-mic" /></svg>
        <svg class="mark mark--meet"><use href="#w-meet" /></svg>
        <!-- Znak ze studia radiowego. Litery, nie ikona: „ON AIR" czyta
             każdy i nikt nie musi zgadywać, co znaczy kolejny rysunek. -->
        <span class="mark mark--air" aria-hidden="true"><i>ON</i><i>AIR</i></span>
      </button>
    </div>

    <script src="../shared/strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/widget.js"></script>
  </body>
</html>
