<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Tekst z ekranu — Cribro Sift</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Tekst z ekranu — Redesign OCR Modal (macOS Dark Theme)
         Czysty, przestrzenny przepływ pionowy, bez nachodzenia sekcji.
         ───────────────────────────────────────────────────────── */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        font-family: var(--font-body, -apple-system, BlinkMacSystemFont, "DM Sans", sans-serif);
        color: var(--text, #f4f4f5);
        user-select: none;
        -webkit-user-select: none;
      }

      #shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        background-color: #121316;
        background-image:
          radial-gradient(120% 120% at 50% 0%, rgba(114, 240, 180, 0.05), transparent 70%),
          linear-gradient(180deg, rgba(24, 24, 27, 0.96) 0%, rgba(18, 19, 22, 0.98) 100%);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 24px 50px -12px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        border-radius: 16px;
        overflow: hidden;
      }

      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: drag;
      }
      header svg {
        width: 16px;
        height: 16px;
        color: var(--accent, #10b981);
        flex-shrink: 0;
      }
      header .label {
        flex: 1;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e4e4e7;
      }
      #close {
        -webkit-app-region: no-drag;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid transparent;
        background: transparent;
        color: #a1a1aa;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        transition: color 0.15s ease, background 0.15s ease;
      }
      #close:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.09);
      }

      #mainView {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(114, 240, 180, 0.4);
        background-clip: content-box;
      }

      /* ── 2. Podgląd zrzutu ────────────────────────────── */
      .preview-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: none;
      }

      #preview {
        position: relative;
        height: 124px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        background: #090a0d;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #preview:hover {
        border-color: rgba(114, 240, 180, 0.4);
        box-shadow: 0 0 16px rgba(114, 240, 180, 0.1);
      }

      #preview img {
        position: absolute;
        inset: 8px;
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        object-fit: contain;
        border-radius: 6px;
      }

      .preview-overlay {
        position: absolute;
        inset: 0;
        background: rgba(14, 14, 18, 0.55);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        opacity: 0;
        color: #ffffff;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 500;
        transition: opacity 0.15s ease;
        border-radius: 10px;
      }
      #preview:hover .preview-overlay {
        opacity: 1;
      }
      .preview-overlay svg {
        width: 16px;
        height: 16px;
        color: var(--accent, #10b981);
      }

      .preview-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .preview-actions-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .preview-action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border: 1px solid rgba(63, 63, 70, 0.5);
        border-radius: 9999px;
        background: rgba(39, 39, 42, 0.6);
        color: #d4d4d8;
        font-family: var(--font-body);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .preview-action-btn:hover {
        color: #ffffff;
        border-color: rgba(82, 82, 91, 0.8);
        background: rgba(63, 63, 70, 0.85);
      }
      .preview-action-btn svg {
        width: 13px;
        height: 13px;
        color: currentColor;
      }
      .preview-action-btn.active {
        color: var(--accent, #10b981);
        border-color: rgba(16, 185, 129, 0.5);
      }

      .copy-feedback {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent, #10b981);
        letter-spacing: 0.04em;
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── Sekcje i nagłówki ────────────────────────────── */
      .group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
      }

      .group__label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      .group__note {
        font-family: var(--font-body);
        font-size: 11px;
        letter-spacing: 0;
        text-transform: none;
        color: #71717a;
        font-weight: 400;
      }

      /* ── 3. Odczyt OCR (Textarea) ─────────────────────── */
      .group--read {
        flex: none;
      }

      #text {
        width: 100%;
        min-height: 110px;
        max-height: 150px;
        overflow-y: auto;
        resize: vertical;
        border: 1px solid rgba(63, 63, 70, 0.6);
        border-radius: 10px;
        outline: none;
        background: #090a0d;
        color: #f4f4f5;
        font-family: var(--font-body);
        font-size: 13.5px;
        line-height: 1.6;
        padding: 12px 14px;
        caret-color: var(--accent, #10b981);
        user-select: text;
        -webkit-user-select: text;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #text:focus {
        border-color: rgba(16, 185, 129, 0.65);
        box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2);
      }
      #text[data-state="reading"] {
        color: #71717a;
      }

      /* ── 4 & 5. Przełączniki segmentowe (DOKĄD / FORMA) ─── */
      .seg {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        background: rgba(24, 24, 27, 0.55);
      }
      .seg button {
        flex: 1;
        padding: 7px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #a1a1aa;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        white-space: nowrap;
        text-align: center;
      }
      .seg button:hover:not([aria-pressed="true"]):not(:disabled) {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.07);
      }
      .seg button[aria-pressed="true"] {
        color: #a7f3d0;
        border-color: rgba(16, 185, 129, 0.75);
        background: rgba(6, 78, 59, 0.7);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
        font-weight: 600;
      }
      .seg button:disabled {
        color: #52525b;
        cursor: not-allowed;
      }

      /* ── 6 & 7. Siatki akcji (DO SCHOWKA / UDOSTĘPNIJ) ─── */
      .action-grid {
        display: grid;
        gap: 8px;
      }
      .action-grid--3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .action-grid--4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .action-card-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 10px;
        border: 1px solid rgba(63, 63, 70, 0.45);
        border-radius: 8px;
        background: rgba(39, 39, 42, 0.55);
        color: #d4d4d8;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
        white-space: nowrap;
      }
      .action-card-btn:hover {
        color: #ffffff;
        border-color: rgba(16, 185, 129, 0.5);
        background: rgba(63, 63, 70, 0.85);
        transform: translateY(-1px);
      }
      .action-card-btn:active {
        transform: translateY(0);
      }
      .action-card-btn svg {
        width: 14px;
        height: 14px;
        color: var(--accent, #10b981);
        flex-shrink: 0;
      }

      select {
        width: 100%;
        margin-top: 4px;
        padding: 8px 12px;
        border: 1px solid rgba(63, 63, 70, 0.6);
        border-radius: 8px;
        background: #121316;
        color: #f4f4f5;
        font-family: var(--font-body);
        font-size: 12.5px;
        outline: none;
      }
      select:focus {
        border-color: rgba(16, 185, 129, 0.6);
      }
      [hidden] {
        display: none !important;
      }

      #note {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(245, 158, 11, 0.3);
        background: rgba(245, 158, 11, 0.1);
        color: #fbbf24;
        font-size: 12px;
        line-height: 1.5;
      }
      #note[data-kind="ok"] {
        border-color: rgba(16, 185, 129, 0.35);
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
      }

      /* ── 8. Stopka ────────────────────────────────────── */
      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(18, 19, 22, 0.7);
      }
      #hint {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #71717a;
      }

      button.act {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 18px;
        border-radius: 8px;
        border: 1px solid rgba(52, 211, 153, 0.6);
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(5, 150, 105, 0.95));
        color: #ffffff;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
      }
      button.act:hover:not(:disabled) {
        border-color: rgba(52, 211, 153, 0.9);
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        transform: translateY(-1px);
      }
      button.act:active:not(:disabled) {
        transform: translateY(0);
      }
      button.act:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.act--quiet {
        border-color: rgba(63, 63, 70, 0.5);
        background: rgba(39, 39, 42, 0.6);
        color: #d4d4d8;
        font-weight: 500;
        box-shadow: none;
      }
      button.act--quiet:hover {
        border-color: rgba(82, 82, 91, 0.8);
        background: rgba(63, 63, 70, 0.9);
        color: #ffffff;
        box-shadow: none;
      }

      /* ─────────────────────────────────────────────────────────
         WIDOK EDYTORA MARKUP / CANVAS
         ───────────────────────────────────────────────────────── */
      #markupView {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #090a0d;
        overflow: hidden;
      }

      .markup-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(24, 24, 27, 0.7);
        -webkit-app-region: no-drag;
      }

      .markup-tool-group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 9999px;
        background: #121316;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .tool-btn {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 50%;
        background: none;
        color: #a1a1aa;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        padding: 0;
      }
      .tool-btn:hover:not(:disabled) {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }
      .tool-btn[aria-pressed="true"],
      .tool-btn.active {
        color: #a7f3d0;
        border-color: rgba(16, 185, 129, 0.75);
        background: rgba(6, 78, 59, 0.7);
      }
      .tool-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .tool-btn svg {
        width: 15px;
        height: 15px;
      }

      .markup-palette {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 6px;
        border-radius: 9999px;
        background: #121316;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .color-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
        padding: 0;
      }
      .color-dot:hover {
        transform: scale(1.15);
      }
      .color-dot.active {
        border-color: #ffffff;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        transform: scale(1.1);
      }

      .stroke-seg {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 9999px;
        background: #121316;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .stroke-btn {
        padding: 4px 8px;
        font-family: var(--font-body);
        font-size: 10px;
        border: 1px solid transparent;
        border-radius: 9999px;
        background: none;
        color: #a1a1aa;
        cursor: pointer;
      }
      .stroke-btn.active {
        color: #a7f3d0;
        border-color: rgba(16, 185, 129, 0.5);
        background: rgba(6, 78, 59, 0.7);
      }

      .markup-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .markup-viewport {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        position: relative;
        padding: 12px;
        overflow: auto;
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 16px 16px,
          #090a0d;
      }

      #markupCanvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
        cursor: crosshair;
        background: transparent;
      }

      .markup-hint-bar {
        padding: 6px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(24, 24, 27, 0.8);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-family: var(--font-mono);
        font-size: 10px;
        color: #a1a1aa;
      }
    </style>
  </head>

        <symbol id="s-apple-notes" viewBox="0 0 24 24">
          <path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.8" rx="3" />
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </symbol>
        <symbol id="s-notion" viewBox="0 0 24 24">
          <path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5z" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M8 7v10l8-10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="s-spark" viewBox="0 0 24 24">
          <path d="M3 8l9 6 9-6M3 6h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="s-whatsapp" viewBox="0 0 24 24">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="shell">
      <!-- 1. Belka tytułowa -->
      <header>
        <svg><use href="#s-frame" /></svg>
        <span class="label">Tekst z ekranu</span>
        <button id="close" aria-label="Zamknij">×</button>
      </header>

      <!-- Widok główny (Standardowy) -->
      <main id="mainView">
        <!-- 2. Sekcja podglądu zrzutu -->
        <div class="preview-box">
          <div id="preview" title="Kliknij, aby edytować zrzut (Markup)">
            <img id="shotImage" alt="Zaznaczony fragment ekranu" />
            <div class="preview-overlay">
              <svg><use href="#s-edit" /></svg>
              <span>Edytuj zrzut (Markup)</span>
            </div>
          </div>

          <div class="preview-actions">
            <div class="preview-actions-left">
              <button type="button" class="preview-action-btn" id="copyImageBtn">
                <svg><use href="#s-copy" /></svg>
                <span>Kopiuj obraz</span>
              </button>
              <button type="button" class="preview-action-btn" id="openMarkupBtn">
                <svg><use href="#s-edit" /></svg>
                <span>Edytor graficzny</span>
              </button>
            </div>
            <span id="copyFeedback" class="copy-feedback" hidden>✓ Skopiowano</span>
          </div>
        </div>

        <div id="note" hidden></div>

        <!-- 3. Sekcja ODCZYT -->
        <div class="group group--read">
          <div class="group__label">
            Odczyt <span class="group__note" id="readNote">poprawki wpisujesz tutaj</span>
          </div>
          <textarea id="text" spellcheck="true" data-state="reading"></textarea>
        </div>

        <!-- 4. Sekcja DOKĄD -->
        <div class="group">
          <div class="group__label">Dokąd</div>
          <div class="seg" id="target">
            <button data-value="new" aria-pressed="true">Nowa notatka</button>
            <button data-value="note" aria-pressed="false">Do notatki</button>
            <button data-value="disk" aria-pressed="false">Zapisz na dysk</button>
          </div>
          <select id="noteId" hidden></select>
        </div>

        <!-- 5. Sekcja FORMA -->
        <div class="group">
          <div class="group__label">
            Forma <span class="group__note" id="formNote"></span>
          </div>
          <div class="seg" id="form">
            <button data-value="text" aria-pressed="true">Tekst</button>
            <button data-value="image" aria-pressed="false">Obrazek</button>
            <button data-value="both" aria-pressed="false">Oba</button>
          </div>
        </div>

        <!-- 6. Sekcja DO SCHOWKA -->
        <div class="group">
          <div class="group__label">Do schowka</div>
          <div class="action-grid action-grid--3">
            <button type="button" class="action-card-btn" id="copyTextBtn" title="Kopiuj odczytany tekst">
              <svg><use href="#s-text" /></svg>
              <span>Tekst</span>
            </button>
            <button type="button" class="action-card-btn" id="copyShotImgBtn" title="Kopiuj zrzut ekranu">
              <svg><use href="#s-frame" /></svg>
              <span>Screenshot</span>
            </button>
            <button type="button" class="action-card-btn" id="copyAllBtn" title="Kopiuj tekst i obraz">
              <svg><use href="#s-copy" /></svg>
              <span>Wszystko</span>
            </button>
          </div>
        </div>

        <!-- 7. Sekcja UDOSTĘPNIJ -->
        <div class="group">
          <div class="group__label">Udostępnij</div>
          <div class="action-grid action-grid--4">
            <button type="button" class="action-card-btn" id="shareAppleNotesBtn" title="Notatki Apple">
              <svg><use href="#s-apple-notes" /></svg>
              <span>Notatki</span>
            </button>
            <button type="button" class="action-card-btn" id="shareNotionBtn" title="Notion">
              <svg><use href="#s-notion" /></svg>
              <span>Notion</span>
            </button>
            <button type="button" class="action-card-btn" id="shareSparkBtn" title="Spark Mail">
              <svg><use href="#s-spark" /></svg>
              <span>Spark</span>
            </button>
            <button type="button" class="action-card-btn" id="shareWhatsAppBtn" title="WhatsApp">
              <svg><use href="#s-whatsapp" /></svg>
              <span>WhatsApp</span>
            </button>
          </div>
        </div>
      </main>

      <!-- 8. Stopka -->
      <footer id="mainFooter">
        <span id="hint">⌘⏎ zapisuje · Esc zamyka</span>
        <button class="act act--quiet" id="cancel">Anuluj</button>
        <button class="act" id="save">Zapisz</button>
      </footer>

      <!-- Widok edytora graficznego (Markup Canvas) -->
      <div id="markupView" hidden>
        <div class="markup-toolbar">
          <!-- Narzędzia wyboru i kształtów -->
          <div class="markup-tool-group">
            <button class="tool-btn active" data-tool="select" title="Zaznacz i przekształć"><svg><use href="#s-select" /></svg></button>
            <button class="tool-btn" data-tool="crop" title="Kadrowanie (Crop)"><svg><use href="#s-crop" /></svg></button>
            <button class="tool-btn" data-tool="highlighter" title="Zakreślacz"><svg><use href="#s-highlighter" /></svg></button>
            <button class="tool-btn" data-tool="rectangle" title="Prostokąt / Ramka"><svg><use href="#s-rect" /></svg></button>
            <button class="tool-btn" data-tool="ellipse" title="Okrąg / Elipsa"><svg><use href="#s-circle" /></svg></button>
            <button class="tool-btn" data-tool="triangle" title="Trójkąt"><svg><use href="#s-triangle" /></svg></button>
            <button class="tool-btn" data-tool="line" title="Linia prosta"><svg><use href="#s-line" /></svg></button>
            <button class="tool-btn" data-tool="arrow" title="Strzałka"><svg><use href="#s-arrow" /></svg></button>
            <button class="tool-btn" data-tool="bubble" title="Dymek dialogowy"><svg><use href="#s-bubble" /></svg></button>
            <button class="tool-btn" data-tool="text" title="Zwykły tekst"><svg><use href="#s-text" /></svg></button>
          </div>

          <!-- Paleta kolorów -->
          <div class="markup-palette">
            <button class="color-dot active" data-color="#ef4444" style="background: #ef4444" title="Czerwony"></button>
            <button class="color-dot" data-color="#eab308" style="background: #eab308" title="Żółty"></button>
            <button class="color-dot" data-color="#22c55e" style="background: #22c55e" title="Zielony"></button>
            <button class="color-dot" data-color="#3b82f6" style="background: #3b82f6" title="Niebieski"></button>
            <button class="color-dot" data-color="#e5b968" style="background: #e5b968" title="Złoty"></button>
            <button class="color-dot" data-color="#ffffff" style="background: #ffffff" title="Biały"></button>
            <button class="color-dot" data-color="#1e1e1e" style="background: #1e1e1e; border-color: #444;" title="Ciemny"></button>
          </div>

          <!-- Grubość linii -->
          <div class="stroke-seg">
            <button class="stroke-btn" data-width="2">2px</button>
            <button class="stroke-btn active" data-width="4">4px</button>
            <button class="stroke-btn" data-width="8">8px</button>
          </div>

          <!-- Rozmiar tekstu -->
          <div class="stroke-seg" id="fontSeg" style="display: none;">
            <button class="stroke-btn" data-size="16">S</button>
            <button class="stroke-btn active" data-size="24">M</button>
            <button class="stroke-btn" data-size="36">L</button>
            <button class="stroke-btn" data-size="48">XL</button>
          </div>

          <!-- Historia i akcje -->
          <div class="markup-tool-group">
            <button class="tool-btn" id="markupUndo" title="Cofnij (⌘Z)" disabled><svg><use href="#s-undo" /></svg></button>
            <button class="tool-btn" id="markupRedo" title="Ponów (⌘⇧Z)" disabled><svg><use href="#s-redo" /></svg></button>
            <button class="tool-btn" id="markupDelete" title="Usuń zaznaczony (Backspace)" disabled><svg><use href="#s-trash" /></svg></button>
          </div>

          <div class="markup-actions">
            <button class="act act--quiet" id="markupCancel">Anuluj</button>
            <button class="act" id="markupDone">Gotowe</button>
          </div>
        </div>

        <div class="markup-viewport">
          <canvas id="markupCanvas"></canvas>
        </div>

        <div class="markup-hint-bar">
          <span>Podwójne kliknięcie edytuje tekst · Przeciągnij uchwyty, aby zmienić rozmiar</span>
          <span>Esc anuluje · ⌘⏎ zatwierdza</span>
        </div>
      </div>
    </div>

    <script src="../shared/strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/markup.js"></script>
    <script src="js/shot.js"></script>
  </body>
</html>
