<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Notatka na wierzchu — Cribro Sift</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/prose.css" />
    <link rel="stylesheet" href="css/note-acts.css" />
    <link rel="stylesheet" href="css/ask.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Kartka na pulpicie — jedna notatka we własnym okienku.

         Trzy rzeczy odróżniają ją od okna Notatnika, i wszystkie trzy
         biorą się stąd, że kartka leży NA CUDZEJ PRACY, a nie obok niej:

           NIEPRZEZROCZYSTA  tekst notatki nie ma prawa mieszać się z tym,
                             co pod spodem. Szkło jest w oknach aplikacji,
                             nie na notatce przyklejonej do ekranu.
           SKALOWANA         ta sama kartka na 13" i na 27" ma zajmować ten
                             sam ułamek pulpitu. Skalę przysyła proces
                             główny (--k), bo tylko on wie, na którym
                             ekranie kartka wylądowała.
           ROZKŁADANA        wychodzi na pulpit rozwinięciem od góry i tak
                             samo się składa. To nie jest ozdoba: kilka
                             kartek pojawiających się naraz wygląda jak
                             usterka, a rozłożone jedna po drugiej — jak
                             położone.

         Treść jest tą samą treścią co w Notatniku, przez ten sam edytor
         (js/editor.js) i ten sam arkusz (css/prose.css). Notatka z listą
         zadań ma na pulpicie wyglądać jak notatka z listą zadań, a nie
         jak Markdown z gwiazdkami.
         ───────────────────────────────────────────────────────── */

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-body);
        color: var(--text);
      }

      :root {
        /* Aureola — margines okna, w którym mieści się cień i wyskok
           animacji poza obrys kartki. Musi zgadzać się ze STICKY_HALO
           w main/main.js, bo to ten sam margines liczony z dwóch stron. */
        --halo: 16px;
        /* Skala ekranu. Podstawia ją js/sticky.js z tego, co przysłał
           proces główny; jedynka jest wartością na czas ładowania. */
        --k: 1;
        --k1: 1;
        --fold: 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #stage {
        position: fixed;
        inset: var(--halo);
        /* Perspektywa jest na scenie, nie na kartce: przeniesiona na sam
           element znikałaby przy każdej innej transformacji. */
        perspective: 1100px;
      }

      /* Kontener kartki — w naturalnej wielkości sceny, bez sztucznego
         rozciągania bitmapy przez GPU (transform: scale), co zapewnia
         idealną ostrość tekstu i obrysów na każdym monitorze. */
      #zoom {
        position: absolute;
        inset: 0;
      }

      /* ── Kartka ── */

      /* ══ ZAZNACZANIE TEKSTU I KURSOR ══
         Jaskrawozielony ::selection z tokenów (:root) znika na jasnym papierze
         karteczki — nadpisujemy eleganckim, wysokim kontrastem. */
      ::selection {
        background: rgba(15, 23, 42, 0.15);
        color: #0f172a;
      }

      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        border: 1px solid var(--paper-edge, rgba(0, 0, 0, 0.07));
        overflow: hidden;
        opacity: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity, box-shadow;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
        transition:
          transform 0.49s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.49s cubic-bezier(0.16, 1, 0.3, 1),
          border-radius 0.49s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.49s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ══ PULSAR — delikatna poświata wokół aktywnej kartki ══
         Miękki, pulsujący indygo gdy edytor ma fokus. Wygasa płynnie przy
         utracie fokusu (transition: box-shadow 0.3s ease na #card). */
      @keyframes pulsar-glow {
        0%, 100% {
          box-shadow:
            0 4px 20px -2px rgba(0, 0, 0, 0.08),
            0 2px 6px -1px rgba(0, 0, 0, 0.04),
            0 0 0 2px rgba(99, 102, 241, 0.08),
            0 0 18px 4px rgba(99, 102, 241, 0.15);
        }
        50% {
          box-shadow:
            0 4px 20px -2px rgba(0, 0, 0, 0.10),
            0 2px 6px -1px rgba(0, 0, 0, 0.06),
            0 0 0 2.5px rgba(99, 102, 241, 0.22),
            0 0 28px 8px rgba(99, 102, 241, 0.30);
        }
      }
      #card.sticky-focused {
        animation: pulsar-glow 2.4s ease-in-out infinite;
      }
      #card.sticky-focused[data-stacked="true"] {
        animation: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #card {
          transition: none !important;
        }
      }

      /* ══ KARTKA ZWINIĘTA W STOSIK (Kompaktowy stosik pastelowych karteczek) ══ */
      #card[data-stacked="true"] {
        transform: rotate(var(--stack-rot, 0deg));
        opacity: 0.98;
        border-radius: 14px;
        box-shadow: 0 8px 20px -2px rgba(0, 0, 0, 0.18), 0 3px 8px -1px rgba(0, 0, 0, 0.10);
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        will-change: transform, box-shadow;
      }
      #card[data-stacked="true"][data-stacked-top="true"] {
        box-shadow:
          0 20px 38px -6px rgba(0, 0, 0, 0.32),
          0 10px 18px -4px rgba(0, 0, 0, 0.18),
          0 2px 6px 0 rgba(0, 0, 0, 0.12);
      }
      #card[data-stacked="true"][data-drag="true"] {
        cursor: grabbing !important;
      }
      #card[data-stacked="true"] .head,
      #card[data-stacked="true"] .body,
      #card[data-stacked="true"] .tools,
      #card[data-stacked="true"] .foot,
      #card[data-stacked="true"] .deck-off,
      #card[data-stacked="true"] #grip,
      #card[data-stacked="true"] .palette,
      #card[data-stacked="true"] .text-colors {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.15s ease;
      }

      /* Rozwinięcie: kartka odchyla się od górnej krawędzi, jak kartka
         wyjmowana z bloczka. Opóźnienie ustawia js/sticky.js — każda
         kolejna wychodzi o chwilę później. */
      #card[data-fold="out"] {
        animation: fold-out var(--fold) var(--delay, 0ms) both;
      }
      #card[data-fold="in"] {
        animation: fold-in 0.26s cubic-bezier(0.4, 0, 1, 1) var(--delay, 0ms) both;
      }

      @keyframes fold-out {
        from {
          opacity: 0;
          transform: rotateX(-16deg) scaleY(0.6) translateY(-8px);
        }
        55% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fold-in {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: rotateX(-12deg) scaleY(0.66) translateY(-6px);
        }
      }

      /* Treść dochodzi chwilę po kształcie. Rozwijająca się kartka
         z gotowym tekstem w środku wygląda jak obrazek, który ktoś
         rozciąga; pusta i zapisana dopiero na końcu — jak kartka. */
      #card[data-fold="out"] .body,
      #card[data-fold="out"] .head,
      #card[data-fold="out"] .foot {
        animation: ink 0.3s ease-out calc(var(--delay, 0ms) + 0.16s) both;
      }
      @keyframes ink {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ── Głowa ──
         Cała jest uchwytem okna: kartkę przesuwa się jak kartkę, łapiąc
         za jej górny brzeg.

         Przeciąganie liczy js/sticky.js, a NIE systemowe
         `-webkit-app-region: drag`. Powód jest jeden i konkretny: obszar
         przeciągania połyka kliknięcia, a w głowie leży tytuł, który ma się
         dać przepisać podwójnym kliknięciem. Z app-region to kliknięcie
         nigdy do niego nie dochodziło. Własne przeciąganie ma próg ruchu,
         więc jedno nie wyklucza drugiego. */
      /* ── Drag Handle (w-8 h-1 rounded-full bg-black/10 mb-6) ── */
      .drag-pill {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        width: 32px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(0, 0, 0, 0.10);
        pointer-events: none;
        transition: background var(--t-fast);
      }
      .head:hover .drag-pill {
        background: rgba(0, 0, 0, 0.20);
      }
      .head {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 14px 12px 6px 16px;
        border-bottom: 1px solid var(--paper-head-border, rgba(0, 0, 0, 0.04));
        background: transparent;
        cursor: grab;
      }
      .head[data-drag="true"] {
        cursor: grabbing;
      }

      /* ══ KARTKA ZWINIĘTA DO NAGŁÓWKA ══

         Notatka schodzi wtedy do samej belki z tytułem — jak roleta. To nie
         to samo, co zdjęcie jej z wierzchu: zwinięta zostaje na pulpicie,
         w swoim miejscu i w swojej kolejności, i wraca jednym kliknięciem.
         Po to się ją zwija: żeby plan dnia leżał obok pracy, a nie na niej.

         Wysokość okna zmienia proces główny (deck:roll); tutaj znika to,
         co ma zniknąć, i obraca się strzałka. */
      #card[data-rolled="true"] .body,
      #card[data-rolled="true"] .tools,
      #card[data-rolled="true"] .foot,
      #card[data-rolled="true"] .deck-off,
      #card[data-rolled="true"] #grip {
        display: none;
      }
      #card[data-rolled="true"] .head {
        border-bottom: none;
      }
      #card[data-rolled="true"] #roll svg {
        transform: rotate(180deg);
      }
      #roll svg {
        transition: transform var(--t);
      }
      .head__title {
        flex: 1;
        min-width: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--paper-head-text, #09090b);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: none;
        -webkit-user-select: none;
        cursor: text;
      }
      /* Przepisywany tytuł przestaje być uchwytem okna — inaczej pierwsze
         kliknięcie w środek słowa przesuwałoby kartkę zamiast postawić
         w niej kursor. */
      .head__title.is-editing {
        cursor: text;
        outline: none;
        color: var(--text-hi);
        box-shadow: inset 0 -1px 0 var(--accent-55);
        overflow-x: auto;
        user-select: text;
        -webkit-user-select: text;
      }
      /* Pasek stanu przy nagrywaniu — kartka mówi o tym samym, o czym mówi
         znaczek w pasku menu, i tym samym kolorem. */
      #card[data-state="listening"] .head {
        background: linear-gradient(180deg, var(--rec-20), transparent);
      }
      #card[data-state="listening"] .head__title {
        color: var(--rec-soft);
      }

      .ico {
        width: 25px;
        height: 25px;
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--paper-head-text, #09090b);
        opacity: 0.85;
        cursor: pointer;
        transition:
          background var(--t),
          opacity var(--t),
          color var(--t);
      }
      .ico:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.08);
        color: var(--paper-head-text, var(--accent));
      }
      .ico--close:hover {
        background: rgba(240, 114, 111, 0.14);
        color: var(--danger);
      }
      .ico .swatch {
        width: 14px;
        height: 14px;
      }

      .ico svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ico[data-state="listening"] {
        color: var(--rec);
        background: var(--rec-12);
      }

      /* ── Paleta kolorów ──
         Wysuwa się spod głowy kartki. Kolor jest po to, żeby rozpoznać
         kartkę, zanim się ją przeczyta — a przy kilku leżących obok siebie
         to jest jedyne, co je od siebie odróżnia z drugiego końca ekranu. */
      .palette {
        position: absolute;
        top: 38px;
        right: 8px;
        z-index: 3;
        display: flex;
        gap: 6px;
        padding: 7px 8px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--paper-sink);
        box-shadow: var(--shadow-md);
        animation: palette-in 0.18s var(--ease) both;
      }
      .palette[hidden] {
        display: none;
      }
      @keyframes palette-in {
        from {
          opacity: 0;
          transform: translateY(-5px) scale(0.96);
        }
      }
      .palette button {
        /* Bez `flex: none` przycisk kurczy się razem z rzędem i próbki
           robią się z kółek kreskami — kółko jest w środku, a to on jest
           tu elementem układu. */
        flex: none;
        line-height: 0;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        border-radius: 50%;
        transition: transform var(--t-fast);
      }
      .palette button:hover {
        transform: scale(1.18);
      }
      .palette button[aria-pressed="true"] .swatch {
        border-color: var(--accent);
        box-shadow: var(--paper-sheen), 0 0 0 2px var(--accent-30);
      }
      .palette .swatch {
        width: 17px;
        height: 17px;
      }

      /* ── Narzędzia pisania ──

         Kartka jest tą samą notatką co w Notatniku, więc ma się w niej dać
         napisać to samo — a listy to jedyna rzecz z formatowania, po którą
         na kartce sięga się naprawdę często. Kartka na pulpicie to najczęściej
         plan dnia albo lista zakupów; bez tego rzędu jedyną drogą do
         kwadracików było otwarcie notatki w Notatniku, czyli opuszczenie
         miejsca, po to żeby postawić kropkę.

         SIEDEM przycisków, nie jedenaście jak w Notatniku, i ani jednego menu.
         W pasku szerokim na dwieście dziesięć pikseli menu byłoby szufladą
         zasłaniającą całą kartkę, a nagłówki i wyrównanie należą do pisania
         dokumentu, nie do dopisywania punktu na wierzchu. Reszta formatowania
         zostaje pod ręką skrótem klawiaturowym (patrz js/sticky.js) i przez
         samo pisanie: „- ", „1. " i „[] " robią listę tak samo jak w każdym
         edytorze tekstu (patrz #autoList w js/editor.js).

         Siódmy znaczek nie formatuje, tylko WSTAWIA: datę z godziną w miejscu
         kursora. Stoi tu, bo na kartce leżącej przy pracy jest po nią równie
         często ręka co po listę — „14:30 — " przed zdaniem robi z notatki
         zapis przebiegu dnia, a sięganie po zegar i kalendarz rozprasza.

         Przyciski są znaczkami bez podpisów — jako jedyne w tej aplikacji
         mogą sobie na to pozwolić, bo „B", kropki listy i kwadracik zadań
         wyglądają tak samo w każdym edytorze od trzydziestu lat. */
      .tools {
        flex: none;
        display: flex;
        align-items: center;
        gap: 1px;
        padding: 3px 6px;
        border-bottom: 1px solid var(--line-soft);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
        /* Ukryty do momentu, w którym ktoś naprawdę sięga po formatowanie —
           papierowa karteczka ma wyglądać jak karteczka, nie jak aplikacja
           z paskiem narzędzi. Krycie, nie `display`: przełączanie go
           przesuwałoby treść pod kursorem w chwili najechania, a to
           dokładnie ten rodzaj skoku, którego kartka ma unikać. Ten sam
           wzór co przy #grip niżej. */
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--t);
      }
      #card:hover .tools,
      .tools:focus-within {
        opacity: 1;
        pointer-events: auto;
      }
      .tools__sep {
        flex: none;
        width: 1px;
        height: 13px;
        /* Trzy piksele, nie cztery: przy siedmiu znaczkach i dwóch kreskach
           cały rząd ma 200 pikseli, a najwęższa kartka — 210. Odstęp jest
           tym, co w tym rachunku zostało do oddania. */
        margin: 0 3px;
        background: var(--line-strong);
      }
      .tool-btn {
        flex: none;
        width: 24px;
        height: 22px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--text-mute);
        cursor: pointer;
        transition:
          background var(--t),
          color var(--t),
          border-color var(--t);
      }
      /* Rysunki niosą fill i stroke same (patrz ICON_SHAPES w js/notes-core.js),
         więc arkusz nadaje im WYŁĄCZNIE rozmiar. Wspólne `fill: none` zabrałoby
         kropki liście punktowanej, a wspólny `stroke` obrysowałby je na grubo. */
      .tool-btn svg {
        width: 14px;
        height: 14px;
      }
      .tool-btn:hover {
        background: var(--accent-08);
        color: var(--accent);
      }
      /* Włączone widać obwódką, nie samym tłem — na ciemnej kartce tło
         w dwunastu procentach akcentu jest nie do odróżnienia od najechania
         kursorem. To ta sama reguła co w Notatniku (.icon-btn w css/notes.css). */
      .tool-btn[aria-pressed="true"] {
        color: var(--accent);
        background: var(--accent-12);
        border-color: var(--accent-30);
      }

      /* ── Kolor tekstu ──
         Kropka w znaczku niesie sam kolor przez zmienną, nie przez klasę
         na kolor — tak samo jak próbka koloru kartki (.swatch--dot), tylko
         bez pośrednictwa `--paper-tint`: to inna paleta, więc dostaje
         własną zmienną. */
      #textColorDot {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--text-color-dot, #0f172a);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      }
      .text-colors {
        position: absolute;
        top: 68px;
        left: 8px;
        z-index: 3;
        display: flex;
        gap: 7px;
        padding: 7px 8px;
        border-radius: var(--r-sm);
        border: 1px solid var(--line-strong);
        background: var(--paper-sink);
        box-shadow: var(--shadow-md);
        animation: palette-in 0.18s var(--ease) both;
      }
      .text-colors[hidden] {
        display: none;
      }
      .text-colors button {
        flex: none;
        line-height: 0;
        padding: 3px;
        border: 1.5px solid transparent;
        background: none;
        cursor: pointer;
        border-radius: 50%;
        transition: transform var(--t-fast), border-color var(--t-fast);
      }
      .text-colors button:hover {
        transform: scale(1.15);
      }
      .text-colors button[aria-pressed="true"] {
        border-color: var(--accent);
      }
      .text-colors .dot {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--text-color-dot, #0f172a);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      }

      /* Kolory zaznaczonego tekstu — czytelne wyłącznie na jasnym papierze,
         więc żyją tu, a nie w prose.css: tamten arkusz obsługuje też
         Notatnik, który bywa ciemny, i te same barwy zginęłyby tam tak
         samo, jak ginął przedtem cały tekst kartki (patrz body.sticky-window
         w css/tokens.css). */
      #text.prose span[data-color="navy"]   { color: #1e3a8a; }
      #text.prose span[data-color="maroon"] { color: #991b1b; }
      #text.prose span[data-color="forest"] { color: #166534; }
      #text.prose span[data-color="slate"]  { color: #475569; }

      /* ── Treść (Padding 24px, System Font 16px, Kolor #1a1a1a, leading-relaxed) ── */

      .body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 24px;
      }
      .body::-webkit-scrollbar {
        width: 6px;
      }
      .body::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 4px;
      }
      .body::-webkit-scrollbar-track {
        background: transparent;
      }

      #text.prose {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: var(--sticky-fs, 16px);
        font-weight: 400;
        line-height: 1.625;
        color: var(--text, #1a1a1a);
        min-height: 100%;
        user-select: text;
        -webkit-user-select: text;
        -webkit-font-smoothing: subpixel-antialiased;
        -moz-osx-font-smoothing: auto;
        font-smooth: always;
        --grip-gutter: 18px;
        /* Kursor tekstowy: wyraźny czarny, standardowy interwał migania. */
        caret-color: #000000 !important;
      }

      /* ══ TYPOGRAFIA MARKDOWN NA KARTCE ══
         Nadpisania prose.css specyficzne dla jasnego tła kartki. */

      /* Punktory — wyraźny grafit zamiast akcentu */
      #text.prose ul li::marker {
        color: #18181b;
      }
      #text.prose ol li::marker {
        color: #3f3f46;
        font-size: 0.88em;
      }

      /* Nagłówki — ciemne, pogrubione, czytelny spacing */
      #text.prose h1,
      #text.prose h2,
      #text.prose h3 {
        color: #09090b;
        font-weight: 700;
      }

      /* Checkbox niezaznaczony */
      #text.prose ul.task > li::before {
        border-color: rgba(0, 0, 0, 0.30);
        background: rgba(255, 255, 255, 0.60);
      }
      #text.prose ul.task > li:hover::before {
        border-color: rgba(99, 102, 241, 0.70);
      }

      /* Odhaczone zadanie: czytelne przekreślenie, stonowany grafit */
      #text.prose ul.task > li[data-done="true"] {
        color: #71717a;
        text-decoration: line-through;
        text-decoration-color: #a1a1aa;
        text-decoration-thickness: 1.5px;
      }
      #text.prose[data-empty="true"]::before {
        font-size: calc(var(--sticky-fs, 16px) - 1.5px);
        padding: 0 var(--s-4) 8%;
        color: var(--text-faint, #64748b);
      }

      /* ── Stopka ── */

      /* Kartka jest mała, a pasek czynności ma się w niej zmieścić razem
         ze stanem zapisu. Podpisy zostają — to one są całą różnicą między
         przyciskiem a zagadką — ale wszystko wokół nich chudnie. */
      .foot__spacer {
        flex: 1 1 auto;
      }
      .foot .note-act {
        height: 24px;
        padding: 0 7px;
        gap: 5px;
        font-size: 9px;
      }
      .foot .note-act svg {
        width: 13px;
        height: 13px;
      }
      /* Podpisy schodzą same, gdy stopce brakuje miejsca — pilnuje tego
         zapytanie o pojemnik w css/note-acts.css. Kartka nie potrzebuje
         własnej reguły. */

      .foot {
        flex: none;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 13px 9px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.05em;
        color: var(--text-mute);
        user-select: none;
        -webkit-user-select: none;
      }
      .foot .dot {
        opacity: 0.4;
      }
      /* ── LICZNIK SŁÓW SCHODZI PIERWSZY ──
         Pięć znaczków czynności, stan zapisu i licznik nie mieszczą się
         w stopce kartki — „25 słów" łamało się na dwa wiersze i rozpychało
         całą stopkę na podwójną wysokość, zabierając ją notatce. Z tych
         trzech rzeczy licznik jest najmniej potrzebny: stan zapisu mówi, czy
         notatka jest bezpieczna, przyciski coś robią, a licznik tylko
         informuje — i to o tym, co widać.

         Próg jest policzony, nie zgadnięty: pięć znaczków bez podpisów to
         163 px, „Zapisane" około 52, licznik z kropką i odstępami około 74,
         wyściółka 26. Razem 315 — stąd 330, z zapasem na dłuższe napisy po
         przełączeniu języka. Pyta o szerokość STOPKI, nie okna; kontener
         zakłada css/note-acts.css, tam gdzie znikają podpisy przycisków. */
      @container (max-width: 330px) {
        .foot #words,
        .foot .dot {
          display: none;
        }
      }
      .foot #state,
      .foot #words {
        white-space: nowrap;
      }
      #state[data-state="saving"] {
        color: var(--accent-55);
      }

      /* ══ ZWIJANIE W STOSIK (CARD STACK) ══
         Przycisk na spodzie notatki zwija wszystkie aktywne kartki w poręczny,
         fizyczny stosik papieru w rogu ekranu. Matowy, spokojny przycisk
         harmonizujący z papierem. */
      .deck-off {
        flex: none;
        display: flex;
        justify-content: center;
        padding: 0 12px 10px;
      }
      .btn-stack {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border: 1px solid rgba(0, 0, 0, 0.09);
        border-radius: var(--r-pill, 9999px);
        background: rgba(0, 0, 0, 0.04);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        color: var(--text-2, #374151);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.01em;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background var(--t-fast, 0.12s),
          color var(--t-fast, 0.12s),
          border-color var(--t-fast, 0.12s),
          transform var(--t-fast, 0.12s),
          box-shadow var(--t-fast, 0.12s);
      }
      .btn-stack:hover {
        background: rgba(0, 0, 0, 0.08);
        border-color: rgba(0, 0, 0, 0.15);
        color: var(--text, #111827);
        transform: translateY(-0.5px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
      }
      .btn-stack:active {
        transform: translateY(0.5px);
        background: rgba(0, 0, 0, 0.11);
      }
      .btn-stack__icon {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        flex: none;
      }

      /* ── Uchwyt rozmiaru ──
         Kartka nie ma ramki, więc nie ma też brzegu, za który dałoby się
         ją złapać — brzeg okna leży w przezroczystej aureoli, poza kartką.
         Uchwyt siedzi więc w prawym dolnym rogu, tam gdzie go szuka ręka,
         i pokazuje się dopiero po najechaniu na kartkę: notatka ma wyglądać
         jak notatka, dopóki nikt jej nie zmienia. */
      #grip {
        position: absolute;
        /* Odsunięty od rogu o cztery piksele, a nie o dwa: kartka ma
           zaokrąglony brzeg i przycina wszystko, co w ten łuk wejdzie. */
        right: 5px;
        bottom: 4px;
        z-index: 4;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-mute);
        cursor: nwse-resize;
        opacity: 0;
        transition: opacity var(--t), color var(--t);
      }
      #card:hover #grip,
      #grip[data-drag="true"] {
        opacity: 0.7;
      }
      #grip:hover {
        opacity: 1;
        color: var(--accent);
      }
      #grip svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
    </style>
  </head>

  <body class="sticky-window">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="s-close" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </symbol>
        <symbol id="s-open" viewBox="0 0 24 24">
          <path d="M14 4h6v6M20 4l-8.5 8.5" />
          <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
        </symbol>
        <!-- Zwinięcie do nagłówka. Strzałka w górę znaczy „schowaj pod
             belkę"; ta sama, obrócona, znaczy „rozwiń z powrotem". -->
        <symbol id="s-roll" viewBox="0 0 24 24">
          <path d="M6 14l6-6 6 6" />
        </symbol>
        <symbol id="s-grip" viewBox="0 0 24 24">
          <path d="M20 8L8 20M20 14l-6 6M20 20h-.01" />
        </symbol>
        <!-- Zwiń w stosik kart -->
        <symbol id="s-stack" viewBox="0 0 24 24">
          <path d="M7 4.5h10a2 2 0 0 1 2 2v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="7.5" width="13" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </symbol>
      </defs>
    </svg>

    <div id="stage">
      <div id="zoom">
        <section id="card" class="paper" data-state="idle">
          <header class="head">
            <div class="drag-pill" aria-hidden="true"></div>
            <span class="head__title" id="title" data-i18n="skip"
                  title="Podwójne kliknięcie zmienia tytuł"></span>
            <button class="ico" id="paint" title="Kolor notatki" aria-expanded="false">
              <span class="swatch"></span>
            </button>
            <button class="ico" id="roll" title="Zwiń do nagłówka">
              <svg><use href="#s-roll" /></svg>
            </button>
            <button class="ico" id="expand" title="Otwórz w Notatniku">
              <svg><use href="#s-open" /></svg>
            </button>
            <button class="ico ico--close" id="dismiss" title="Zdejmij z wierzchu">
              <svg><use href="#s-close" /></svg>
            </button>
          </header>
          <div class="palette" id="palette" hidden data-i18n="skip"></div>

          <!-- Narzędzia pisania. Rysunki dokłada ensureIcons z js/notes-core.js
               — to samo źródło, z którego bierze je pasek czynności, więc „B"
               na kartce jest tym samym „B", co w Notatniku. -->
          <div class="tools" id="tools">
            <button class="tool-btn" data-format="bold" title="Pogrubienie (⌘B)"
                    aria-label="Pogrubienie" aria-pressed="false">
              <svg><use href="#i-bold" /></svg>
            </button>
            <button class="tool-btn" data-format="italic" title="Kursywa (⌘I)"
                    aria-label="Kursywa" aria-pressed="false">
              <svg><use href="#i-italic" /></svg>
            </button>
            <span class="tools__sep"></span>
            <!-- Kolor zaznaczonego tekstu. Znaczek nie jest literą „A" z
                 kropką pod spodem, tylko samą kropką — pasek jest wąski
                 na dwieście dziesięć pikseli i litera zabierałaby miejsce
                 bez niczego nie mówiąc więcej niż kropka. Kropka NIESIE
                 aktualny kolor (patrz #textColorDot w js/sticky.js), więc
                 przycisk odpowiada od razu na pytanie „w jakim kolorze
                 stoi kursor", bez otwierania popovera. -->
            <button class="tool-btn" id="textColor" title="Kolor tekstu"
                    aria-label="Kolor tekstu" aria-haspopup="true" aria-expanded="false">
              <span class="dot" id="textColorDot"></span>
            </button>
            <div class="text-colors" id="textColors" hidden data-i18n="skip"></div>
            <span class="tools__sep"></span>
            <button class="tool-btn" data-format="bullet" title="Lista (⌘⇧8)"
                    aria-label="Lista" aria-pressed="false">
              <svg><use href="#i-list" /></svg>
            </button>
            <button class="tool-btn" data-format="numbered" title="Lista numerowana (⌘⇧7)"
                    aria-label="Lista numerowana" aria-pressed="false">
              <svg><use href="#i-list-num" /></svg>
            </button>
            <button class="tool-btn" data-format="todo" title="Lista zadań (⌘⇧9)"
                    aria-label="Lista zadań" aria-pressed="false">
              <svg><use href="#i-todo" /></svg>
            </button>
            <span class="tools__sep"></span>
            <button class="tool-btn" data-format="quote" title="Cytat (⌘⇧')"
                    aria-label="Cytat" aria-pressed="false">
              <svg><use href="#i-quote" /></svg>
            </button>
            <!-- Data i godzina w miejscu kursora. Stoi przy cytacie, a nie za
                 własną kreską, bo na trzecią kreskę w rzędzie szerokim na
                 dwieście pikseli po prostu nie ma miejsca — a wstawienie
                 znacznika JEST pisaniem, więc należy do tej samej grupy. -->
            <button class="tool-btn" id="stamp" title="Wstaw datę i godzinę (⌘T)"
                    aria-label="Wstaw datę i godzinę">
              <svg><use href="#i-datestamp" /></svg>
            </button>
          </div>

          <div class="body">
            <div
              id="text"
              class="prose"
              spellcheck="true"
              data-i18n="skip"
              data-empty="true"
              data-placeholder="Pisz albo podyktuj skrótem."
            ></div>
          </div>

          <!-- Czynności na notatce. Ten sam pasek co w Notatniku i z tego
               samego kodu (patrz actionBar w js/notes-core.js) — kartka na
               pulpicie jest tą samą notatką, więc ma z niej dać się zrobić
               to samo. „Na pulpit" tu nie ma: kartka już na nim leży,
               a zdejmuje ją krzyżyk w nagłówku. -->
          <footer class="foot">
            <span id="state">Zapisane</span>
            <span class="dot">·</span>
            <span id="words">0 słów</span>
            <span class="foot__spacer"></span>
            <div id="acts"></div>
          </footer>

          <!-- Zwiń w stosik kart — zamiast surowego ukrywania, zwija kartki
               w poręczny stosik w rogu ekranu, odsłaniając pulpit. -->
          <div class="deck-off">
            <button type="button" class="btn-stack" id="stackAll"
                    title="Zwija wszystkie kartki w poręczny stosik w rogu ekranu.">
              <svg class="btn-stack__icon"><use href="#s-stack" /></svg>
              <span class="btn-stack__label">Zwiń w stosik</span>
            </button>
          </div>

          <button id="grip" title="Zmień rozmiar kartki">
            <svg><use href="#s-grip" /></svg>
          </button>
        </section>
      </div>
    </div>

    <script src="../shared/strings.js"></script>
    <script src="../shared/richtext.js"></script>
    <script src="../shared/blockmove.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/ask.js"></script>
    <script src="js/notes-core.js"></script>
    <script src="js/link-card.js"></script>
    <script src="js/sticky.js"></script>
  </body>
</html>
