<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <!-- Tytuł okna jest CELOWO bezbarwny.

         Tytuły wszystkich okien na ekranie są widoczne dla każdej innej
         aplikacji (CGWindowList) i to samo źródło czyta nasze wykrywanie
         rozmów (src/main/detect.js). Okno o nazwie „Spotkanie — …", stojące
         obok trwającej rozmowy, jest dokładnie tym, czego szukałby cudzy
         wykrywacz „asystentów AI" — a Cribro asystentem w rozmowie nie
         jest: nie dołącza do niej, nic do niej nie mówi i nie ma jej czym
         zakłócić. Nazwa okna nie ma go w to wrabiać.

         Nazwa spotkania jest w środku okna, gdzie należy do człowieka,
         który je otworzył. Patrz scripts/quiet-test.js. -->
    <title>Cribro Sift</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/prose.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/ask.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Jedno spotkanie we własnym oknie.

         Nie jest to drugi widok spotkania, tylko druga POSTAĆ tego samego:
         rysuje je ten sam js/meetings-view.js, którym rysuje się zakładka
         w oknie głównym. Osobny plik oznaczałby dwa notatniki, dwie
         transkrypcje i dwa miejsca do poprawienia przy każdej zmianie —
         a rozjechałyby się przy pierwszej.

         Po co osobne okno: spotkanie ogląda się W TRAKCIE innej pracy —
         pisząc z niego maila albo siedząc na następnym. Wtedy okno główne
         jest w drodze, bo trzeba je przełączyć i znaleźć w nim zakładkę.
         ───────────────────────────────────────────────────────── */

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      /* Belka tytułowa jest ukryta (titleBarStyle: hiddenInset), więc
         miejsce na światła okna trzeba zrobić samemu — inaczej pierwszy
         wiersz treści leży pod nimi. Cały ten pas jest uchwytem: okno bez
         ramki nie ma za co złapać. */
      #bar {
        height: 38px;
        -webkit-app-region: drag;
      }

      /* Kafel spotkania idzie od krawędzi do krawędzi: to całe okno, a nie
         panel położony w oknie obok czegoś jeszcze. */
      #solo {
        height: calc(100% - 38px);
      }
    </style>
  </head>
  <body>
    <!-- Tło motywu — pierwszym dzieckiem body, reszta warstwę wyżej. -->
    <canvas id="constellation"></canvas>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4.5 7h15M9.5 7V5.4a1.4 1.4 0 0 1 1.4-1.4h2.2a1.4 1.4 0 0 1 1.4 1.4V7M6.6 7l.8 12a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.8-12"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <!-- Koło zębate rysuje meetings-view.js przy spisie rozmów. To okno
             spisu nie pokazuje, więc go nie narysuje — ale rysuje je TEN SAM
             plik, a okno bez symbolu byłoby pustym kwadratem w chwili, w której
             ktoś kiedyś ten spis tu doda. -->
        <!-- KOŁO ZĘBATE, A NIE SŁONECZKO.

             Poprzedni rysunek był okręgiem z ośmioma kreskami dookoła —
             czyli słońcem. Znak ustawień musi być rozpoznawalny bez
             czytania podpisu, bo po to jest znakiem; ten mówił „jasność"
             albo „motyw". Teraz jest to koło z ośmioma ZĘBAMI: zamknięty
             obrys z wcięciami między zębami i piastą w środku. -->
        <symbol id="i-gear" viewBox="0 0 24 24">
          <path
            d="M11.02 2.5h1.96a.7.7 0 0 1 .69.58l.26 1.53c.5.16.98.36 1.42.61l1.28-.9a.7.7 0 0 1 .9.08l1.38 1.38a.7.7 0 0 1 .08.9l-.9 1.28c.25.44.45.92.6 1.42l1.54.26a.7.7 0 0 1 .58.69v1.96a.7.7 0 0 1-.58.69l-1.53.26c-.16.5-.36.98-.61 1.42l.9 1.28a.7.7 0 0 1-.08.9l-1.38 1.38a.7.7 0 0 1-.9.08l-1.28-.9c-.44.25-.92.45-1.42.6l-.26 1.54a.7.7 0 0 1-.69.58h-1.96a.7.7 0 0 1-.69-.58l-.26-1.53a6.9 6.9 0 0 1-1.42-.61l-1.28.9a.7.7 0 0 1-.9-.08L5.1 18.9a.7.7 0 0 1-.08-.9l.9-1.28a6.9 6.9 0 0 1-.6-1.42l-1.54-.26a.7.7 0 0 1-.58-.69v-1.96a.7.7 0 0 1 .58-.69l1.53-.26c.16-.5.36-.98.61-1.42l-.9-1.28a.7.7 0 0 1 .08-.9L6.48 5.1a.7.7 0 0 1 .9-.08l1.28.9c.44-.25.92-.45 1.42-.6l.26-1.54a.7.7 0 0 1 .68-.58Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5" />
        </symbol>
        <symbol id="i-window" viewBox="0 0 24 24">
          <rect x="3.5" y="5" width="17" height="14" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M3.5 9h17" fill="none" stroke="currentColor" stroke-width="1.6" />
        </symbol>
        <!-- js/meetings-view.js jest wspólny z oknem głównym i rysuje tę
             strzałkę w agendaCard() — także tutaj, choć w trybie solo
             ta karta się dziś nie pokazuje. Symbol ma być pod ręką na
             wszelki wypadek, a nie dopiero wtedy, gdy ktoś to zmieni. -->
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="bar"></div>
    <div id="solo"></div>

    <script src="../shared/strings.js"></script>
    <script src="../shared/richtext.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/mock-bridge.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/constellation.js"></script>
    <script src="js/ask.js"></script>
    <script src="js/meetings-view.js"></script>
    <script src="js/meeting-solo.js"></script>
  </body>
</html>
